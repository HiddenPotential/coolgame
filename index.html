  // the house (target)
  for (const [r, col] of [[104, '#2f6fd0'], [70, '#ffffff'], [36, '#e63946'], [12, '#ffffff']]) {
    c.fillStyle = col; circle(hx, hy, r, c); c.fill();
  }
  c.strokeStyle = 'rgba(30,40,60,.35)'; c.lineWidth = 1.5;
  c.beginPath(); c.moveTo(20, hy); c.lineTo(930, hy); c.stroke();
  c.beginPath(); c.moveTo(hx, 20); c.lineTo(hx, H - 20); c.stroke();
  c.fillStyle = '#d62828'; c.fillRect(hole.hog - 3, 20, 6, H - 40); // hog line
  c.fillStyle = 'rgba(30,40,60,.6)'; c.fillRect(925, 20, 3, H - 40);
  // out of play behind the back line
  g = c.createLinearGradient(928, 0, 980, 0);
  g.addColorStop(0, '#8fb4d6'); g.addColorStop(1, '#5d86ad');
  c.fillStyle = g; c.fillRect(928, 20, 52, H - 40);
  // the hack you push off from
  const [sx, sy] = hole.start;
  c.fillStyle = '#222'; roundRect(sx - 46, sy - 22, 12, 18, 3, c); c.fill(); roundRect(sx - 46, sy + 4, 12, 18, 3, c); c.fill();
  // frost around the edge
  g = c.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, W * .7);
  g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(1, 'rgba(255,255,255,.4)');
  c.fillStyle = g; c.fillRect(0, 0, W, H);
}

// where a lob will land (ignoring wobble and curve)
function lobLanding(ang, power) {
  const club = CLUBS[clubIdx];
  let sp = MAX_SPEED * power * club.power * item.power, dist = 0;
  const T = .45 + .65 * power, f = Math.pow(.997, .5);
  for (let t = 0; t < T; t += 1 / 120) { dist += sp / 120; sp *= f; }
  return [ball.x + Math.cos(ang) * dist, ball.y + Math.sin(ang) * dist, dist];
}

// ---------- Drawing ----------
// Render at the screen's pixel density so everything stays crisp on retina displays.
const DPR = Math.min(2, window.devicePixelRatio || 1);
// Everything flat that never moves (grass, sand, lines, cup) is painted once per level into bg and used as the floor.
const bg = document.createElement('canvas');
bg.width = W * DPR; bg.height = H * DPR;
const bctx = bg.getContext('2d');
const TAU = Math.PI * 2;

function roundRect(x, y, w, h, r, c = ctx, begin = true) {
  r = Math.min(r, w / 2, h / 2);
  if (begin) c.beginPath();
  c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function circle(x, y, r, c = ctx) { c.beginPath(); c.arc(x, y, r, 0, TAU); }
// seeded random so each hole's grass texture looks the same every time
function rng(seed) {
  return () => {
    seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
// dark blurred edge just inside a rounded rect, so it reads as sunken
function innerShadow(c, r, rad, color, blur, offY = 3) {
  c.save();
  roundRect(r[0], r[1], r[2], r[3], rad, c); c.clip();
  c.shadowColor = color; c.shadowBlur = blur * DPR; c.shadowOffsetY = offY * DPR;
  c.fillStyle = '#000';
  c.beginPath(); c.rect(r[0] - 60, r[1] - 60, r[2] + 120, r[3] + 120);
  roundRect(r[0], r[1], r[2], r[3], rad, c, false);
  c.fill('evenodd');
  c.restore();
}

function drawWall(r, c = ctx, style = 'wood') {
  const [x, y, w, h] = r, long = w >= h;
  if (style === 'post') {
    c.save(); c.shadowColor = 'rgba(0,0,0,.35)'; c.shadowBlur = 6 * DPR; c.shadowOffsetX = 3 * DPR; c.shadowOffsetY = 4 * DPR;
    const pg = long ? c.createLinearGradient(x, y, x, y + h) : c.createLinearGradient(x, y, x + w, y);
    pg.addColorStop(0, '#ffffff'); pg.addColorStop(1, '#c9ced4');
    c.fillStyle = pg; roundRect(x, y + h * .2, w, h * .6, h * .3, c); c.fill(); c.restore();
    return;
  }
  c.save();
  c.shadowColor = 'rgba(0,0,0,.38)'; c.shadowBlur = 8 * DPR; c.shadowOffsetX = 3 * DPR; c.shadowOffsetY = 5 * DPR;
  c.fillStyle = '#6e4423'; roundRect(x, y, w, h, 6, c); c.fill();
  c.restore();
  const g = long ? c.createLinearGradient(x, y, x, y + h) : c.createLinearGradient(x, y, x + w, y);
  g.addColorStop(0, '#d9a468'); g.addColorStop(.45, '#b97d45'); g.addColorStop(1, '#8a562b');
  c.fillStyle = g; roundRect(x + 2, y + 2, w - 4, h - 4, 5, c); c.fill();
  c.save(); roundRect(x + 2, y + 2, w - 4, h - 4, 5, c); c.clip();
  // wood grain
  c.strokeStyle = 'rgba(90,50,20,.22)'; c.lineWidth = 1;
  const across = long ? h : w, along = long ? w : h, n = Math.max(1, Math.floor(across / 7));
  for (let i = 1; i <= n; i++) {
    c.beginPath();
    for (let t = 0; t <= along; t += 16) {
      const o = i * across / (n + 1) + Math.sin(t * .045 + i * 2.3) * 1.3;
      long ? c.lineTo(x + t, y + o) : c.lineTo(x + o, y + t);
    }
    c.stroke();
  }
  // plank seams
  c.strokeStyle = 'rgba(55,28,8,.4)'; c.lineWidth = 1.5;
  for (let t = 110; t < along - 20; t += 110) {
    c.beginPath();
    long ? (c.moveTo(x + t, y), c.lineTo(x + t, y + h)) : (c.moveTo(x, y + t), c.lineTo(x + w, y + t));
    c.stroke();
  }
  c.restore();
  c.strokeStyle = 'rgba(255,232,195,.5)'; c.lineWidth = 1.5;
  roundRect(x + 2.75, y + 2.75, w - 5.5, h - 5.5, 4, c); c.stroke();
}

function buildBackground() {
  const c = bctx, R = rng(holeIdx * 977 + 13);
  c.setTransform(DPR, 0, 0, DPR, 0, 0);
  c.clearRect(0, 0, W, H);
  let g;
  const theme = hole.theme || 'grass';
  if (theme === 'lane') paintLane(c, R);
  else if (theme === 'pitch') paintPitch(c, R);
  else if (theme === 'court') paintCourt(c, R);
  else if (theme === 'ice') paintIce(c, R);
  else paintGrass(c, R);
  paintHazards(c, R);
  // the rails are 3D boxes now; paint the floor under them dark
  c.fillStyle = '#4a3423';
  for (const r of border) c.fillRect(...r);
}

function paintGrass(c, R) {
  // grass with a mowed diagonal pattern and little blades
  let g = c.createLinearGradient(0, 0, W, H);
  g.addColorStop(0, '#6cc865'); g.addColorStop(1, '#4aa64b');
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  c.fillStyle = 'rgba(255,255,255,.065)';
  for (let x = -H; x < W + H; x += 90) {
    c.beginPath(); c.moveTo(x, 0); c.lineTo(x + 45, 0); c.lineTo(x + 45 - H * .5, H); c.lineTo(x - H * .5, H); c.fill();
  }
  c.lineWidth = 1.2;
  for (let i = 0; i < 1800; i++) {
    const x = R() * W, y = R() * H;
    c.strokeStyle = R() < .55 ? 'rgba(25,85,30,.2)' : 'rgba(225,255,200,.16)';
    c.beginPath(); c.moveTo(x, y); c.lineTo(x + (R() - .5) * 3, y - 2.5 - R() * 3.5); c.stroke();
  }
  for (let i = 0; i < 18; i++) { // tiny flowers
    const x = 40 + R() * (W - 80), y = 40 + R() * (H - 80);
    c.fillStyle = R() < .5 ? 'rgba(255,255,255,.8)' : 'rgba(255,230,90,.8)';
    for (let k = 0; k < 5; k++) { const a = k * TAU / 5; circle(x + Math.cos(a) * 2.2, y + Math.sin(a) * 2.2, 1.5, c); c.fill(); }
    c.fillStyle = '#ffb703'; circle(x, y, 1.2, c); c.fill();
  }
}

function paintHazards(c, R) {
  let g;

  // darker fringe around hazards
  c.fillStyle = 'rgba(30,95,38,.32)';
  for (const r of [...hole.water, ...hole.sand]) { roundRect(r[0] - 8, r[1] - 8, r[2] + 16, r[3] + 16, 32, c); c.fill(); }

  // sand traps
  for (const r of hole.sand) {
    g = c.createLinearGradient(r[0], r[1], r[0] + r[2], r[1] + r[3]);
    g.addColorStop(0, '#f8e7b4'); g.addColorStop(1, '#e2c37f');
    c.fillStyle = g; roundRect(r[0], r[1], r[2], r[3], 30, c); c.fill();
    c.save(); roundRect(r[0], r[1], r[2], r[3], 30, c); c.clip();
    for (let i = 0; i < r[2] * r[3] / 30; i++) {
      c.fillStyle = R() < .5 ? 'rgba(150,110,50,.22)' : 'rgba(255,255,255,.4)';
      c.fillRect(r[0] + R() * r[2], r[1] + R() * r[3], 1.6, 1.6);
    }
    c.strokeStyle = 'rgba(165,125,65,.2)'; c.lineWidth = 2;
    for (let y = r[1] + 12; y < r[1] + r[3]; y += 11) {
      c.beginPath(); for (let x = r[0]; x <= r[0] + r[2]; x += 6) c.lineTo(x, y + Math.sin(x / 16) * 2.5); c.stroke();
    }
    c.restore();
    innerShadow(c, r, 30, 'rgba(110,75,25,.55)', 10);
  }

  // water basins (the moving surface is drawn every frame)
  for (const r of hole.water) {
    g = c.createLinearGradient(r[0], r[1], r[0], r[1] + r[3]);
    g.addColorStop(0, '#2a74bd'); g.addColorStop(1, '#4aa3e3');
    c.fillStyle = g; roundRect(r[0], r[1], r[2], r[3], 24, c); c.fill();
    innerShadow(c, r, 24, 'rgba(5,30,70,.7)', 16, 5);
  }

  // speed pads base
  for (const bz of hole.boosts) {
    c.save(); c.shadowColor = 'rgba(0,0,0,.25)'; c.shadowBlur = 6 * DPR; c.shadowOffsetY = 2 * DPR;
    g = c.createLinearGradient(bz[0], bz[1], bz[0] + bz[2], bz[1]);
    g.addColorStop(0, '#ff7a2f'); g.addColorStop(1, '#ffb347');
    c.fillStyle = g; roundRect(bz[0], bz[1], bz[2], bz[3], 12, c); c.fill(); c.restore();
    c.strokeStyle = 'rgba(255,255,255,.75)'; c.lineWidth = 2.5; roundRect(bz[0] + 3, bz[1] + 3, bz[2] - 6, bz[3] - 6, 10, c); c.stroke();
  }

  if (!hole.cup) return;
  // tee box
  const [tx, ty] = hole.start;
  c.save(); c.shadowColor = 'rgba(0,0,0,.25)'; c.shadowBlur = 6 * DPR; c.shadowOffsetY = 2 * DPR;
  c.fillStyle = '#3c9a45'; roundRect(tx - 34, ty - 34, 68, 68, 12, c); c.fill(); c.restore();
  c.fillStyle = 'rgba(255,255,255,.07)';
  for (let i = 0; i < 4; i++) c.fillRect(tx - 34 + i * 17, ty - 32, 8.5, 64);
  c.strokeStyle = 'rgba(255,255,255,.45)'; c.lineWidth = 2; c.setLineDash([6, 5]);
  roundRect(tx - 29, ty - 29, 58, 58, 9, c); c.stroke(); c.setLineDash([]);

  // the green around the cup, and the cup itself
  const [cx, cy] = hole.cup;
  g = c.createRadialGradient(cx, cy, 12, cx, cy, 52);
  g.addColorStop(0, 'rgba(140,225,130,.95)'); g.addColorStop(1, 'rgba(140,225,130,0)');
  c.fillStyle = g; circle(cx, cy, 52, c); c.fill();
  c.strokeStyle = 'rgba(255,255,255,.12)'; c.lineWidth = 1;
  for (let k = 22; k < 46; k += 6) { circle(cx, cy, k, c); c.stroke(); }
  g = c.createRadialGradient(cx - 4, cy - 5, 1, cx, cy, 16);
  g.addColorStop(0, '#000'); g.addColorStop(.75, '#151515'); g.addColorStop(1, '#3d3d3d');
  c.fillStyle = g; circle(cx, cy, 15.5, c); c.fill();
  c.strokeStyle = 'rgba(255,255,255,.85)'; c.lineWidth = 2;
  c.beginPath(); c.arc(cx, cy, 15.5, .1 * Math.PI, .95 * Math.PI); c.stroke();

  // soft vignette on the grass
  g = c.createRadialGradient(W / 2, H / 2, H * .3, W / 2, H / 2, W * .72);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,35,5,.28)');
  c.fillStyle = g; c.fillRect(0, 0, W, H);
}

function drawWaterSurface(r) {
  const [x, y, w, h] = r;
  ctx.save(); roundRect(x, y, w, h, 24); ctx.clip();
  ctx.strokeStyle = 'rgba(255,255,255,.2)'; ctx.lineWidth = 2;
  for (let yy = y + 16; yy < y + h; yy += 24) {
    ctx.beginPath();
    for (let xx = x - 10; xx <= x + w + 10; xx += 8) ctx.lineTo(xx, yy + Math.sin(xx / 24 + time * 1.7 + yy * .31) * 3.5);
    ctx.stroke();
  }
  const n = Math.floor(w * h / 7000);
  for (let i = 0; i < n; i++) {
    const a = Math.sin(time * 2.5 + i * 1.93);
    if (a < .4) continue;
    const sx = x + (i * 137.5 + 11) % w, sy = y + (i * 89.7 + i * i * 3.1) % h;
    ctx.fillStyle = `rgba(255,255,255,${((a - .4) * 1.4).toFixed(2)})`;
    ctx.beginPath(); ctx.moveTo(sx, sy - 4); ctx.lineTo(sx + 1.2, sy); ctx.lineTo(sx, sy + 4); ctx.lineTo(sx - 1.2, sy); ctx.fill();
    ctx.beginPath(); ctx.moveTo(sx - 4, sy); ctx.lineTo(sx, sy + 1.2); ctx.lineTo(sx + 4, sy); ctx.lineTo(sx, sy - 1.2); ctx.fill();
  }
  ctx.restore();
  ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 2.5;
  ctx.setLineDash([16, 12]); ctx.lineDashOffset = -time * 12;
  roundRect(x + 3, y + 3, w - 6, h - 6, 21); ctx.stroke();
  ctx.setLineDash([]); ctx.lineDashOffset = 0;
}

function drawBoost(bz) {
  ctx.save(); roundRect(bz[0] + 4, bz[1] + 4, bz[2] - 8, bz[3] - 8, 9); ctx.clip();
  ctx.translate(bz[0] + bz[2] / 2, bz[1] + bz[3] / 2); ctx.rotate(bz[4]);
  const off = (time * 90) % 42, span = Math.max(bz[2], bz[3]);
  for (let x = -span - 42; x < span + 42; x += 42) {
    const px = x + off, glow = .45 + .55 * clamp((px + span / 2) / span, 0, 1);
    ctx.fillStyle = `rgba(255,248,232,${glow.toFixed(2)})`;
    ctx.beginPath(); ctx.moveTo(px, -20); ctx.lineTo(px + 17, 0); ctx.lineTo(px, 20); ctx.lineTo(px + 7, 0); ctx.fill();
  }
  ctx.restore();
}

// ---------- 3D ----------
// The game logic stays flat (x across, y down the screen). Here that world is shown in 3D:
// field x -> world X, field y -> world Z, and world Y is height.
const wx = x => x - W / 2, wz = y => y - H / 2;
const DS = 1.25; // resolution of the flat effects layer
deco.width = W * DS; deco.height = H * DS;

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(DPR);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, W / H, 10, 7000);
const hemi = new THREE.HemisphereLight(0xffffff, 0x9a9488, .62);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, .5);
sun.position.set(-380, 820, -300);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -720, right: 720, top: 620, bottom: -620, near: 100, far: 2200 });
sun.shadow.bias = -.0006;
scene.add(sun);

const groundTex = new THREE.CanvasTexture(bg);
groundTex.anisotropy = renderer.capabilities.getMaxAnisotropy();
const decoTex = new THREE.CanvasTexture(deco);
decoTex.anisotropy = groundTex.anisotropy;
let level3D = null;      // everything built for the current level
const sprites = new Map(); // bodies -> their sprites

// ----- textures -----
const texCache = new Map(), sharedTex = new Set([groundTex, decoTex]);
function emojiTex(ch) {
  if (!texCache.has(ch)) {
    const c = document.createElement('canvas'); c.width = c.height = 128;
    const x = c.getContext('2d');
    x.font = '104px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillStyle = '#000';
    x.fillText(ch, 64, 70);
    const tx = new THREE.CanvasTexture(c); texCache.set(ch, tx); sharedTex.add(tx);
  }
  return texCache.get(ch);
}
function textTex(text, big = false) {
  const key = (big ? 'B:' : 'T:') + text;
  if (!texCache.has(key)) {
    const c = document.createElement('canvas'); c.width = 512; c.height = 128;
    const x = c.getContext('2d');
    x.textAlign = 'center'; x.textBaseline = 'middle';
    if (big) {
      x.font = '700 92px Fredoka, sans-serif';
      x.lineWidth = 16; x.strokeStyle = 'rgba(0,0,0,.5)'; x.strokeText(text, 256, 68);
      x.fillStyle = '#ffd23d'; x.fillText(text, 256, 68);
    } else {
      x.font = '600 60px Fredoka, sans-serif';
      const w = x.measureText(text).width + 50;
      x.fillStyle = 'rgba(25,35,25,.75)'; roundRect(256 - w / 2, 24, w, 84, 42, x); x.fill();
      x.fillStyle = '#fff'; x.fillText(text, 256, 68);
    }
    const tx = new THREE.CanvasTexture(c); texCache.set(key, tx); sharedTex.add(tx);
  }
  return texCache.get(key);
}
const shadowTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const x = c.getContext('2d'), g = x.createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0, 'rgba(0,0,0,.55)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  x.fillStyle = g; x.fillRect(0, 0, 64, 64);
  const tx = new THREE.CanvasTexture(c); sharedTex.add(tx); return tx;
})();
const woodCanvas = (() => {
  const c = document.createElement('canvas'); c.width = 512; c.height = 96;
  drawWall([-8, -8, 528, 112], c.getContext('2d'));
  return c;
})();
const netTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const x = c.getContext('2d');
  x.strokeStyle = 'rgba(255,255,255,.85)'; x.lineWidth = 2;
  for (let i = 0; i <= 64; i += 16) { x.beginPath(); x.moveTo(i, 0); x.lineTo(i, 64); x.moveTo(0, i); x.lineTo(64, i); x.stroke(); }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
})();

// ----- builders -----
const mat = (color, extra = {}) => new THREE.MeshLambertMaterial({ color, ...extra });
function mesh(geo, material, x, y, z, shadows = true) {
  const m = new THREE.Mesh(geo, material);
  m.position.set(x, y, z);
  m.castShadow = shadows; m.receiveShadow = true;
  level3D.add(m);
  return m;
}
function woodBox(r, h) {
  const [x, y, w, d] = r, t = new THREE.CanvasTexture(woodCanvas);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  if (w >= d) t.repeat.set(w / 260, 1); else { t.center.set(.5, .5); t.rotation = Math.PI / 2; t.repeat.set(d / 260, 1); }
  return mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshLambertMaterial({ map: t }), wx(x + w / 2), h / 2, wz(y + d / 2));
}
function sprite(ch, size, parent = scene) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: emojiTex(ch), transparent: true }));
  s.scale.set(size, size, 1);
  parent.add(s);
  return s;
}
function blob(parent = scene) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, depthWrite: false }));
  m.rotation.x = -Math.PI / 2; m.renderOrder = 2;
  parent.add(m);
  return m;
}
function place(obj, x, y, h = 0) { obj.position.set(wx(x), h, wz(y)); }
function setBlob(b, x, y, r, lift = 0) {
  place(b, x + 4 + lift * .3, y + 5 + lift * .3, .7);
  const s = r * 2.1 * (1 + lift / 200);
  b.scale.set(s, s, 1);
  b.material.opacity = Math.max(.25, 1 - lift / 250);
}

const THEMES = {
  grass: { sky: 0x9fd8ff, floor: 0x4f9e4b, trees: true },
  pitch: { sky: 0x8fcfff, floor: 0x3f8f3f, stands: true },
  lane:  { sky: 0x17121c, floor: 0x241b17 },
  court: { sky: 0x231d2b, floor: 0x3a2a1e, stands: true },
  ice:   { sky: 0xcfe6ff, floor: 0xeaf4ff, snow: true },
};

function build3D() {
  if (level3D) {
    scene.remove(level3D);
    level3D.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material && o.material.map && !sharedTex.has(o.material.map)) o.material.map.dispose(); });
  }
  for (const s of sprites.values()) { scene.remove(s.sprite); scene.remove(s.shadow); }
  sprites.clear();
  level3D = new THREE.Group(); scene.add(level3D);
  const th = THEMES[hole.theme || 'grass'], R = rng(holeIdx * 31 + 7);
  scene.background = new THREE.Color(th.sky);
  scene.fog = new THREE.Fog(th.sky, 1600, 4200);

  // surroundings, the field and the flat effects layer
  const floor = mesh(new THREE.PlaneGeometry(9000, 9000), mat(th.floor), 0, -2, 0, false);
  floor.rotation.x = -Math.PI / 2;
  groundTex.needsUpdate = true;
  const ground = mesh(new THREE.PlaneGeometry(W, H), new THREE.MeshLambertMaterial({ map: groundTex }), 0, 0, 0, false);
  ground.rotation.x = -Math.PI / 2;
  const decal = mesh(new THREE.PlaneGeometry(W, H), new THREE.MeshBasicMaterial({ map: decoTex, transparent: true, depthWrite: false }), 0, .5, 0, false);
  decal.rotation.x = -Math.PI / 2; decal.renderOrder = 1; decal.receiveShadow = false;

  // scenery around the field
  const outside = (x, z) => Math.abs(x) > 560 || Math.abs(z) > 380;
  if (th.trees) for (let i = 0; i < 46; i++) {
    const x = (R() - .5) * 2000, z = (R() - .5) * 1500;
    if (!outside(x, z)) continue;
    const s = .7 + R() * .8, leaf = mat([0x2f8a3a, 0x3c9d3f, 0x27773a][i % 3]);
    mesh(new THREE.CylinderGeometry(6 * s, 8 * s, 40 * s, 8), mat(0x7a5230), x, 20 * s, z);
    mesh(new THREE.ConeGeometry(42 * s, 80 * s, 9), leaf, x, 70 * s, z);
    mesh(new THREE.ConeGeometry(32 * s, 64 * s, 9), leaf, x, 108 * s, z);
  }
  if (th.snow) for (let i = 0; i < 30; i++) {
    const x = (R() - .5) * 2000, z = (R() - .5) * 1500;
    if (!outside(x, z)) continue;
    const s = 30 + R() * 60, m = mesh(new THREE.SphereGeometry(s, 12, 8), mat(0xffffff), x, -s * .35, z);
    m.scale.y = .6;
  }
  if (th.stands) {
    const colors = [0xff7a3d, 0x3db4ff, 0xffd23d, 0xff4fa3, 0x7dff6a, 0xffffff];
    for (const side of [-1, 1]) for (let row = 0; row < 4; row++) {
      const z = side * (400 + row * 40);
      mesh(new THREE.BoxGeometry(1100, 20 + row * 24, 40), mat(0x8a8f99), 0, 10 + row * 12, z);
      for (let k = 0; k < 40; k++) if (R() < .7) {
        const fan = mesh(new THREE.SphereGeometry(8, 8, 6), mat(colors[Math.floor(R() * colors.length)]), -520 + k * 26.5 + R() * 6, 26 + row * 24 + R() * 4, z);
        fan.castShadow = false;
      }
    }
  }

  // walls and rails
  for (const r of border) woodBox(r, 30);
  if (hole.theme === 'pitch') {
    const white = mat(0xffffff);
    for (const r of hole.walls) mesh(new THREE.BoxGeometry(r[2], 6, r[3]), white, wx(r[0] + r[2] / 2), 3, wz(r[1] + r[3] / 2));
    // goal frame and net
    const [gx, gy, , gh] = hole.goal, px = wx(gx - 25), top = 78, z1 = wz(gy - 10), z2 = wz(gy + gh + 10), bx = wx(W - B - 2);
    for (const z of [z1, z2]) mesh(new THREE.CylinderGeometry(4, 4, top, 10), white, px, top / 2, z);
    const bar = mesh(new THREE.CylinderGeometry(4, 4, z2 - z1, 10), white, px, top, (z1 + z2) / 2); bar.rotation.x = Math.PI / 2;
    const netMat = new THREE.MeshBasicMaterial({ map: netTex, transparent: true, side: THREE.DoubleSide, depthWrite: false });
    const nt = netTex.clone(); nt.needsUpdate = true; nt.repeat.set((z2 - z1) / 16, top / 16); netMat.map = nt;
    const back = mesh(new THREE.PlaneGeometry(z2 - z1, top * .8), netMat, bx, top * .4, (z1 + z2) / 2, false); back.rotation.y = Math.PI / 2;
    const depth = bx - px, roof = mesh(new THREE.PlaneGeometry(Math.hypot(depth, top * .2), z2 - z1), netMat, (px + bx) / 2, top * .9, (z1 + z2) / 2, false);
    roof.rotation.x = -Math.PI / 2;
    for (const z of [z1, z2]) { const sd = mesh(new THREE.PlaneGeometry(depth, top * .85), netMat, (px + bx) / 2, top * .42, z, false); }
  } else for (const r of hole.walls) woodBox(r, 34);

  // bumpers
  level3D.userData.bumpers = hole.bumpers.map(bm => {
    const g = new THREE.Group(); place(g, bm[0], bm[1]); level3D.add(g);
    const body = new THREE.Mesh(new THREE.CylinderGeometry(bm[2], bm[2] * 1.05, 24, 32), mat(0xff4f9a, { emissive: 0x000000 }));
    body.position.y = 12; body.castShadow = body.receiveShadow = true; g.add(body);
    const rim = new THREE.Mesh(new THREE.TorusGeometry(bm[2] * .72, 3, 8, 32), mat(0xffffff));
    rim.rotation.x = Math.PI / 2; rim.position.y = 24; g.add(rim);
    const cap = new THREE.Mesh(new THREE.CylinderGeometry(bm[2] * .46, bm[2] * .5, 30, 24), mat(0xffd6e8));
    cap.position.y = 15; cap.castShadow = true; g.add(cap);
    return { g, body, bm };
  });

  // windmills
  level3D.userData.mills = hole.mills.map(m => {
    const g = new THREE.Group(); place(g, m[0], m[1]); level3D.add(g);
    const post = new THREE.Mesh(new THREE.CylinderGeometry(14, 18, 50, 16), mat(0x7a4a24)); post.position.y = 25; post.castShadow = true; g.add(post);
    const knob = new THREE.Mesh(new THREE.SphereGeometry(9, 12, 8), mat(0xffd23d)); knob.position.y = 54; g.add(knob);
    const blades = new THREE.Group(); g.add(blades);
    const L = m[2] - 4;
    for (let k = 0; k < 4; k++) {
      const arm = new THREE.Group(); arm.rotation.y = -k * Math.PI / 2; blades.add(arm);
      const b = new THREE.Mesh(new THREE.BoxGeometry(L, 12, 16), mat(k % 2 ? 0xf5efe2 : 0xe04848));
      b.position.set(8 + L / 2, 14, 0); b.castShadow = true; arm.add(b);
    }
    return { blades, m };
  });

  // moving drawers and characters
  level3D.userData.movers = hole.movers.map(m => {
    if (m[8]) {
      const size = Math.max(m[2], m[3]) * 1.15;
      const s = sprite(m[8], size, level3D); s.center.set(.5, .08);
      return { m, s, sh: blob(level3D), size };
    }
    const box = woodBox(moverRect(m, 0), 32);
    const s = sprite('🧦', 22, level3D);
    return { m, box, s };
  });

  // golf flag
  if (hole.cup) {
    const [cx, cy] = hole.cup;
    mesh(new THREE.CylinderGeometry(2.2, 2.2, 100, 8), mat(0xeeeeee), wx(cx), 50, wz(cy));
    mesh(new THREE.SphereGeometry(4, 10, 8), mat(0xffd23d), wx(cx), 101, wz(cy));
    const c = document.createElement('canvas'); c.width = 128; c.height = 80;
    const x = c.getContext('2d'), g = x.createLinearGradient(0, 0, 128, 80);
    g.addColorStop(0, '#ff5a4e'); g.addColorStop(1, '#d92d4a');
    x.fillStyle = g; x.fillRect(0, 0, 128, 80);
    x.fillStyle = '#fff'; x.font = '700 50px Fredoka, sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(holeIdx + 1, 60, 44);
    const flag = mesh(new THREE.PlaneGeometry(46, 28, 12, 1), new THREE.MeshLambertMaterial({ map: new THREE.CanvasTexture(c), side: THREE.DoubleSide }), wx(cx) + 23, 84, wz(cy));
    level3D.userData.flag = flag;
  }

  // basketball hoop
  if (hole.hoop) {
    const g = new THREE.Group(); level3D.add(g);
    const r = hole.hoop.r, white = mat(0xfafafa);
    const add = (geo, m, x, y, z) => { const o = new THREE.Mesh(geo, m); o.position.set(x, y, z); o.castShadow = true; g.add(o); return o; };
    add(new THREE.CylinderGeometry(5, 6, 110, 10), mat(0x555a60), r + 48, 55, 0);
    add(new THREE.BoxGeometry(30, 6, 6), mat(0x555a60), r + 33, 100, 0);
    const board = add(new THREE.BoxGeometry(6, 64, 104), white, r + 16, 90, 0);
    add(new THREE.BoxGeometry(7, 26, 40), mat(0xe04848), r + 15.5, 80, 0).scale.set(1, 1, 1);
    add(new THREE.BoxGeometry(7, 22, 34), white, r + 15, 80, 0);
    add(new THREE.BoxGeometry(18, 4, 6), mat(0x9aa0a6), r + 6, 60, 0);
    const rim = add(new THREE.TorusGeometry(r, 3, 10, 36), mat(0xff7a1a)); rim.rotation.x = Math.PI / 2; rim.position.y = 60;
    const net = new THREE.Mesh(new THREE.CylinderGeometry(r, r * .55, 30, 18, 3, true),
      new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true, transparent: true, opacity: .8 }));
    net.position.y = 44; g.add(net);
    const sh = blob(g); sh.position.set(10, .7, 10); sh.scale.set(r * 2.6, r * 2.6, 1);
    level3D.userData.hoop = g;
  }

  // the item, its shadow and the club
  level3D.userData.ball = sprite(item.emoji, 32, level3D);
  level3D.userData.ballShadow = blob(level3D);
  level3D.userData.club = sprite('🥖', 40, level3D);
  level3D.userData.swing = sprite('🥖', 44, level3D);
  level3D.userData.pct = new THREE.Sprite(new THREE.SpriteMaterial({ map: textTex('0%'), transparent: true, depthTest: false }));
  level3D.userData.pct.scale.set(120, 30, 1); level3D.userData.pct.renderOrder = 5; level3D.add(level3D.userData.pct);
  level3D.userData.floaters = new Map();
  points3D.visible = true;
  resize3D();
  snapCamera = true;
}

// ----- particles as a point cloud -----
const MAXP = 800;
const pGeo = new THREE.BufferGeometry();
pGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(MAXP * 3), 3));
pGeo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(MAXP * 3), 3));
const points3D = new THREE.Points(pGeo, new THREE.PointsMaterial({ size: 9, vertexColors: true, sizeAttenuation: true }));
points3D.frustumCulled = false;
scene.add(points3D);
const colorCache = new Map();
const col3 = c => { if (!colorCache.has(c)) colorCache.set(c, new THREE.Color(c)); return colorCache.get(c); };

// ----- camera -----
let camMode = 0, snapCamera = true;
const camPos = new THREE.Vector3(), camLook = new THREE.Vector3();
function focusPoint() {
  if (hole.cup) return hole.cup;
  if (hole.goal) return [960, 320];
  if (hole.hoop) return hoopPos();
  if (hole.house) return hole.house;
  if (hole.pins) return [800, 320];
  return [W / 2, H / 2];
}
let followDir = [1, 0];
function updateCamera(dt) {
  let pos, look;
  if (camMode === 0) {
    const a = camera.aspect, dist = a < 1.45 ? 1450 / a : 1000;
    pos = [0, dist * .82, dist * .62]; look = [0, 0, 30];
  } else {
    if (!aim && !shotActive && !ball.moving) {
      const [tx, ty] = focusPoint(), dx = tx - ball.x, dy = ty - ball.y, d = Math.hypot(dx, dy) || 1;
      followDir = [dx / d, dy / d];
    }
    const [fx, fy] = followDir, bx = ball.gone ? ball.last[0] : ball.x, by = ball.gone ? ball.last[1] : ball.y;
    pos = [wx(bx - fx * 330), 250, wz(by - fy * 330)];
    look = [wx(bx + fx * 180), 0, wz(by + fy * 180)];
  }
  const k = snapCamera ? 1 : 1 - Math.exp(-(aim ? 1.5 : 3.5) * dt);
  if (!aim || snapCamera) { // hold still while aiming so the drag stays steady
    camPos.lerp(new THREE.Vector3(...pos), k); camLook.lerp(new THREE.Vector3(...look), k);
  }
  snapCamera = false;
  camera.position.copy(camPos);
  if (shake > 0) camera.position.add(new THREE.Vector3((Math.random() - .5) * shake * 2, (Math.random() - .5) * shake * 2, 0));
  camera.lookAt(camLook);
}
function toggleCam() {
  camMode = 1 - camMode;
  $('camBtn').textContent = camMode ? '🎥 Follow' : '🎥 Overview';
  toast(camMode ? 'Camera: following the item' : 'Camera: overview', 1000);
}

function resize3D() {
  const w = canvas.clientWidth || W, h = canvas.clientHeight || H;
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
window.addEventListener('resize', () => { resize3D(); });

// ----- screen point -> spot on the field -----
const raycaster = new THREE.Raycaster(), groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), hitV = new THREE.Vector3();
function screenToField(e) {
  const r = canvas.getBoundingClientRect();
  raycaster.setFromCamera(new THREE.Vector2((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1), camera);
  if (!raycaster.ray.intersectPlane(groundPlane, hitV)) return null;
  return [hitV.x + W / 2, hitV.z + H / 2];
}

function liftOf() {
  if (!(ball.air > 0)) return 0;
  const k = 1 - ball.air / ball.airT;
  return Math.sin(k * Math.PI) * (hole.lob ? 150 : 75) * Math.min(1, ball.airT + .25);
}

// flat things painted on the ground each frame: water ripples, aim guide, rings
function drawDecals() {
  ctx.setTransform(DS, 0, 0, DS, 0, 0);
  ctx.clearRect(0, 0, W, H);
  for (const r of hole.water) drawWaterSurface(r);
  for (const bz of hole.boosts) drawBoost(bz);
  for (const b of bodies) if (!b.gone && b.kind === 'stone') { ctx.strokeStyle = '#ffd23d'; ctx.lineWidth = 3; circle(b.x, b.y, b.r + 5); ctx.stroke(); }
  if (state === 'play' && !ball.moving && !aim && !ball.gone && !shotActive) {
    const t = (time * 1.2) % 1;
    ctx.strokeStyle = `rgba(255,255,255,${(.8 * (1 - t)).toFixed(2)})`; ctx.lineWidth = 3;
    circle(ball.x, ball.y, item.r + 6 + t * 16); ctx.stroke();
  }
  if (!ball.gone && ball.trail && !(ball.air > 0)) {
    const tr = ball.trail;
    for (let i = 0; i < tr.length; i++) {
      const u = (i + 1) / tr.length;
      ctx.fillStyle = `rgba(255,255,255,${(u * .25).toFixed(3)})`;
      circle(tr[i][0], tr[i][1], item.r * (.3 + u * .45)); ctx.fill();
    }
  }
  if (!ball.gone && item.floats && hole.water.some(r => inRect(ball.x, ball.y, r))) {
    for (let k = 0; k < 2; k++) {
      const t = (time * .8 + k * .5) % 1;
      ctx.strokeStyle = `rgba(255,255,255,${(.6 * (1 - t)).toFixed(2)})`; ctx.lineWidth = 2;
      circle(ball.x, ball.y, item.r + t * 24); ctx.stroke();
    }
  }
  if (aim && state === 'play') drawAim();
  for (const r of rings) {
    const u = 1 - r.t / r.life;
    ctx.strokeStyle = r.color; ctx.globalAlpha = 1 - u; ctx.lineWidth = r.width * (1 - u * .6) + 1;
    circle(r.x, r.y, 6 + u * r.max); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  decoTex.needsUpdate = true;
}

// the aim guide on the ground (the club and % label are 3D sprites)
function drawAim() {
  const { ang, power } = aimVec(), club = CLUBS[clubIdx];
  const landing = hole.lob ? lobLanding(ang, power) : null;
  const len = landing ? Math.max(20, landing[2] - item.r - 14) : 40 + power * 210, col = `hsl(${120 - power * 120},90%,55%)`;
  if (landing) {
    ctx.save(); ctx.translate(landing[0], landing[1]);
    ctx.strokeStyle = 'rgba(255,255,255,.95)'; ctx.lineWidth = 3; ctx.setLineDash([6, 5]); ctx.lineDashOffset = -time * 20;
    circle(0, 0, item.r + 4); ctx.stroke(); ctx.setLineDash([]);
    ctx.beginPath(); ctx.moveTo(-8, 0); ctx.lineTo(8, 0); ctx.moveTo(0, -8); ctx.lineTo(0, 8); ctx.stroke();
    ctx.restore();
  }
  ctx.lineCap = 'round';
  ctx.strokeStyle = 'rgba(0,0,0,.3)'; ctx.lineWidth = 7; circle(ball.x, ball.y, item.r + 12); ctx.stroke();
  ctx.strokeStyle = col; ctx.lineWidth = 6;
  ctx.beginPath(); ctx.arc(ball.x, ball.y, item.r + 12, -Math.PI / 2, -Math.PI / 2 + power * TAU); ctx.stroke();
  ctx.lineCap = 'butt';
  ctx.save(); ctx.translate(ball.x, ball.y); ctx.rotate(ang);
  const path = u => {
    const x = item.r + 14 + u * len;
    if (club.wobble) return [x, Math.sin(x / 10 + time * 12) * 9 * u];
    if (club.chicken) return [x, Math.sin(u * Math.PI) * Math.sin(time * 4) * 38];
    return [x, 0];
  };
  const dots = Math.max(4, Math.floor(len / 14));
  for (let i = 0; i <= dots; i++) {
    const u = i / dots, [px, py] = path(u), rad = 6 - u * 3;
    ctx.fillStyle = 'rgba(0,0,0,.25)'; circle(px + 1.5, py + 2, rad); ctx.fill();
    ctx.fillStyle = i % 2 ? col : '#ffffff'; circle(px, py, rad); ctx.fill();
  }
  const [ex, ey] = path(1);
  ctx.translate(ex, ey);
  ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(20, 0); ctx.lineTo(0, -12); ctx.lineTo(0, 12); ctx.fill();
  ctx.restore();
}

function syncSprite(s, x, y, size, h) { place(s, x, y, h); s.scale.set(size, size, 1); }

function draw() {
  const U = level3D.userData;
  drawDecals();

  for (const { g, body, bm } of U.bumpers) {
    bm.flash = Math.max(0, (bm.flash || 0) - 1 / 60);
    const s = 1 + bm.flash * .8;
    g.scale.set(s, 1 + bm.flash * 1.5, s);
    body.material.emissive.setHex(bm.flash ? 0xffb000 : 0x000000);
  }
  for (const { blades, m } of U.mills) blades.rotation.y = -m[3] * time;
  for (const o of U.movers) {
    const r = moverRect(o.m, time), cx = r[0] + r[2] / 2, cy = r[1] + r[3] / 2;
    if (o.box) { place(o.box, cx, cy, 16); place(o.s, cx, cy, 44); }
    else { place(o.s, cx, cy, Math.abs(Math.sin(time * 9 + o.m[7])) * 3); setBlob(o.sh, cx, cy, o.size * .4); }
  }
  if (U.flag) {
    const p = U.flag.geometry.attributes.position;
    for (let i = 0; i < p.count; i++) { const u = (p.getX(i) + 23) / 46; p.setZ(i, Math.sin(time * 5 - u * 4) * 5 * u); }
    p.needsUpdate = true;
  }
  if (U.hoop) { const [hx, hy] = hoopPos(); place(U.hoop, hx, hy); }

  // knocked-around things
  const seen = new Set();
  for (const b of bodies) {
    if (b.gone) continue;
    seen.add(b);
    let o = sprites.get(b);
    if (!o) { o = { sprite: sprite(b.emoji, 10), shadow: blob() }; sprites.set(b, o); }
    const size = b.r * (b.kind === 'pin' ? 3 : 2.6);
    if (b.down) {
      syncSprite(o.sprite, b.x, b.y, size, size * .3);
      o.sprite.material.rotation = b.fall + Math.PI / 2; o.sprite.material.opacity = .55;
    } else {
      syncSprite(o.sprite, b.x, b.y, size, size * .45);
      o.sprite.material.rotation = 0; o.sprite.material.opacity = 1;
    }
    setBlob(o.shadow, b.x, b.y, b.r);
  }
  for (const [b, o] of sprites) if (!seen.has(b)) { scene.remove(o.sprite); scene.remove(o.shadow); sprites.delete(b); }

  // the item
  const bs = U.ball, bsh = U.ballShadow;
  let lift = liftOf(), scale = 1;
  if (state === 'sinking') { sinkAnim += 1 / 60; scale = Math.max(0, 1 - sinkAnim * 2.5); ball.x += (hole.cup[0] - ball.x) * .2; ball.y += (hole.cup[1] - ball.y) * .2; lift = -sinkAnim * 30; }
  bs.visible = bsh.visible = !ball.gone && scale > 0;
  if (bs.visible) {
    bs.material.map = emojiTex(item.emoji);
    const inWater = item.floats && hole.water.some(r => inRect(ball.x, ball.y, r));
    const size = item.r * 2.7 * scale, q = ball.squash || 0;
    place(bs, ball.x, ball.y, size * .46 + lift + (inWater ? Math.sin(time * 6) * 2 - 4 : 0));
    bs.scale.set(size * (1 + q * .25), size * (1 - q * .25), 1);
    bs.material.rotation = item.hops || item.floats ? 0 : -ball.rot;
    setBlob(bsh, ball.x, ball.y, item.r * scale, Math.max(0, lift));
  }

  // the club winding up, the swing, and the power label
  const club = CLUBS[clubIdx];
  U.club.visible = !!(aim && state === 'play');
  U.pct.visible = U.club.visible;
  if (U.club.visible) {
    const { ang, power } = aimVec(), d = item.r + 24 + power * 34;
    U.club.material.map = emojiTex(club.emoji);
    place(U.club, ball.x - Math.cos(ang) * d, ball.y - Math.sin(ang) * d, 26 + power * 10);
    U.club.material.rotation = (club.chicken ? 0 : Math.PI / 2) - power * .6;
    U.pct.material.map = textTex(Math.round(power * 100) + '%');
    place(U.pct, ball.x, ball.y, item.r * 2.3 + 34);
  }
  U.swing.visible = !!swing;
  if (swing) {
    swing.t += 1 / 60;
    const k = swing.t / .35;
    if (k > 1) { swing = null; U.swing.visible = false; }
    else {
      U.swing.material.map = emojiTex(swing.club.emoji);
      U.swing.material.opacity = 1 - k;
      place(U.swing, ball.last[0] - Math.cos(swing.ang) * (30 - k * 40), ball.last[1] - Math.sin(swing.ang) * (30 - k * 40), 26);
      U.swing.material.rotation = Math.PI / 2 - k * 2;
    }
  }

  // floating "+2" scores
  for (const f of floaters) {
    let s = U.floaters.get(f);
    if (!s) {
      s = new THREE.Sprite(new THREE.SpriteMaterial({ map: textTex(f.text, true), transparent: true, depthTest: false }));
      s.scale.set(160, 40, 1); s.renderOrder = 6; level3D.add(s); U.floaters.set(f, s);
    }
    s.material.opacity = Math.min(1, f.t * 2);
    place(s, f.x, f.y + 30, 70 + (1.3 - f.t) * 60);
  }
  for (const [f, s] of U.floaters) if (!floaters.includes(f)) { level3D.remove(s); U.floaters.delete(f); }

  // particles
  const pos = pGeo.attributes.position.array, colr = pGeo.attributes.color.array;
  const n = Math.min(MAXP, particles.length);
  for (let i = 0; i < n; i++) {
    const p = particles[i], c = col3(p.color);
    pos[i * 3] = wx(p.x); pos[i * 3 + 1] = (p.z || 0) + 2; pos[i * 3 + 2] = wz(p.y);
    colr[i * 3] = c.r; colr[i * 3 + 1] = c.g; colr[i * 3 + 2] = c.b;
  }
  pGeo.setDrawRange(0, n);
  pGeo.attributes.position.needsUpdate = pGeo.attributes.color.needsUpdate = true;

  $('hint').classList.toggle('show', state === 'play' && !ball.moving && !aim && strokes === 0 && !ball.gone);
  updateCamera(drawDt);
  renderer.render(scene, camera);
}

// ---------- Loop ----------
let lastT = performance.now(), drawDt = 1 / 60;
function frame(now) {
  let dt = Math.min(.05, (now - lastT) / 1000); lastT = now; drawDt = dt;
  time += dt;
  if (state === 'play') {
    const n = 6, h = dt / n;
    for (let i = 0; i < n && state === 'play'; i++) { step(h); stepBodies(h); }
    if (state === 'play' && shotActive) {
      shotT += dt;
      restT = (ball.gone || !ball.moving) && bodiesResting() ? restT + dt : 0;
      if (restT > .45 || shotT > 14) resolveShot();
    }
  }
  for (const p of particles) {
    p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
    p.z += p.vz * dt; p.vz -= (p.rect ? 500 : 900) * dt;
    if (p.z < 0) { p.z = 0; p.vz *= -.3; }
    const k = Math.pow(p.rect ? .9 : .94, dt * 60); p.vx *= k; p.vy *= k;
    if (p.rect) p.rot += p.vr * dt;
  }
  particles = particles.filter(p => p.life > 0);
  for (const r of rings) r.t -= dt;
  for (const f of floaters) { f.t -= dt; f.y -= 40 * dt; }
  floaters = floaters.filter(f => f.t > 0);
  rings = rings.filter(r => r.t > 0);
  shake = Math.max(0, shake - dt * 30);
  if (ball) {
    ball.squash = Math.max(0, (ball.squash || 0) - dt * 5);
    ball.trail = ball.trail || [];
    if (ball.moving && state === 'play') { ball.trail.push([ball.x, ball.y]); if (ball.trail.length > 12) ball.trail.shift(); }
    else if (ball.trail.length) ball.trail.shift();
  }
  if (hole) draw();
  requestAnimationFrame(frame);
}

// ---------- Start ----------
$('introBtn').onclick = () => { show(null); state = 'play'; };
$('againBtn').onclick = () => startSport(sport.key);
$('menuBtn').onclick = showMenu;
$('camBtn').onclick = toggleCam;
$('menuBtn2').onclick = showMenu;

buildClubs();
buildSportGrid();
prepLevel(0); // golf hole 1 sits behind the title screen
// ?sport=bowling&hole=N jumps straight in (handy for practice)
const params = new URLSearchParams(location.search);
const jumpSport = SPORTS[params.get('sport')] ? params.get('sport') : params.get('hole') ? 'golf' : null;
if (jumpSport) {
  sport = SPORTS[jumpSport]; LEVELS = sport.levels;
  $('hTitle').textContent = `${sport.emoji} ${sport.name}`;
  const jump = clamp(+params.get('hole') || 1, 1, LEVELS.length);
  scores = LEVELS.slice(0, jump - 1).map(h => sport.golf ? h.par : 0);
  loadHole(jump - 1);
}
requestAnimationFrame(frame);
})();
</script>

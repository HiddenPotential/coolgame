<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wacky Sports</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<meta name="description" content="Golf, bowling, penalties, hoops and curling, but the ball is a rubber duck and the club is a wet fish.">
<style>
  :root {
    --bg: #1d2b1f;
    --panel: #fdf6e3;
    --ink: #2b2118;
    --accent: #ff7a3d;
    --accent2: #3db4ff;
    --muted: #7a6a58;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(circle at 50% 0%, #2f4a33, var(--bg) 70%);
    color: var(--ink);
    font-family: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: 10px 16px 16px;
    user-select: none; -webkit-user-select: none;
  }
  #hud {
    width: 100%; max-width: 1000px;
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between;
    background: var(--panel); border-radius: 14px; padding: 8px 14px;
    box-shadow: 0 4px 0 #c9b98f; margin-bottom: 10px;
  }
  #hud .title { font-weight: 900; font-size: 20px; color: var(--accent); letter-spacing: .5px; }
  #hud .stat { font-size: 15px; }
  #hud .stat b { font-size: 18px; }
  #hud button { font: inherit; border: 0; background: #eadfc3; border-radius: 8px; padding: 4px 10px; cursor: pointer; }
  #wrap { position: relative; width: 100%; max-width: min(1000px, calc((100vh - 200px) * 1.5625)); min-width: min(100%, 320px); }
  canvas {
    display: block; width: 100%; height: auto; border-radius: 16px;
    box-shadow: 0 8px 0 #0f1a10, 0 14px 34px rgba(0,0,0,.45);
    touch-action: none; cursor: crosshair; background: #4caf50;
  }
  #toast {
    position: absolute; left: 50%; top: 14px; transform: translateX(-50%);
    background: rgba(253,246,227,.95); padding: 8px 16px; border-radius: 999px;
    font-weight: 700; font-size: 16px; pointer-events: none;
    opacity: 0; transition: opacity .25s; max-width: 90%; text-align: center;
    box-shadow: 0 3px 0 #c9b98f;
  }
  #toast.show { opacity: 1; }
  .screen {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(15,26,16,.45); border-radius: 16px; padding: 12px;
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  }
  .screen.show .card { animation: pop .35s cubic-bezier(.2,1.6,.4,1); }
  @keyframes pop { from { transform: scale(.85); opacity: 0; } to { transform: none; opacity: 1; } }
  .screen.show { display: flex; }
  .card {
    background: var(--panel); border-radius: 18px; padding: 20px 26px; max-width: 560px; width: 100%;
    text-align: center; box-shadow: 0 6px 0 #c9b98f; max-height: 100%; overflow: auto;
  }
  .card h1 { margin: 0 0 6px; font-size: 38px; color: var(--accent); }
  .card h2 { margin: 0 0 6px; font-size: 26px; }
  .card p { margin: 8px 0; line-height: 1.4; }
  .big-emoji { font-size: 64px; line-height: 1.1; }
  .btn {
    font: inherit; font-weight: 800; font-size: 20px; border: 0; cursor: pointer;
    background: var(--accent); color: white; padding: 10px 26px; border-radius: 12px;
    box-shadow: 0 4px 0 #c4501d; margin-top: 10px;
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #c4501d; }
  .small { font-size: 13px; color: var(--muted); }
  .btn.alt { background: #4c9be8; box-shadow: 0 4px 0 #2b6cb0; }
  .sports { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin: 14px 0 8px; }
  .sport {
    font: inherit; border: 0; cursor: pointer; background: #fff; border-radius: 14px; padding: 10px 8px;
    box-shadow: 0 4px 0 #d8c9a3; display: flex; flex-direction: column; align-items: center; gap: 2px;
    transition: transform .12s, box-shadow .12s;
  }
  .sport:hover { transform: translateY(-3px); box-shadow: 0 7px 0 #e0a070; }
  .sport:active { transform: translateY(2px); box-shadow: 0 2px 0 #d8c9a3; }
  .sport .e { font-size: 36px; line-height: 1.1; }
  .sport b { font-size: 16px; }
  .sport .d { font-size: 12px; color: var(--muted); line-height: 1.25; }
  .sport .best { font-size: 11px; color: var(--accent); font-weight: 600; min-height: 14px; }
  table.score { border-collapse: collapse; margin: 10px auto; font-size: 14px; width: 100%; }
  table.score td, table.score th { border-bottom: 1px solid #e3d7b8; padding: 3px 6px; }
  table.score th { text-align: left; }
  table.score td { text-align: center; }
  #clubs {
    width: 100%; max-width: 1000px; margin-top: 14px;
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
  }
  .club {
    font: inherit; border: 3px solid transparent; background: var(--panel); border-radius: 12px;
    padding: 6px 8px; cursor: pointer; text-align: left; display: flex; gap: 8px; align-items: center;
    box-shadow: 0 4px 0 #c9b98f;
  }
  .club .e { font-size: 30px; }
  .club .n { font-weight: 800; font-size: 15px; }
  .club .d { font-size: 12px; color: var(--muted); }
  .club { transition: transform .12s, box-shadow .12s; }
  .club:hover { transform: translateY(-2px); }
  .club.sel { border-color: var(--accent); background: #fff1e0; transform: translateY(-3px); box-shadow: 0 7px 0 #e0a070; }
  .club kbd { font-size: 11px; background: #eadfc3; border-radius: 4px; padding: 0 4px; margin-left: 4px; }
  #item {
    width: 100%; max-width: 1000px; margin-top: 10px; color: #e9f5e0; font-size: 14px; text-align: center;
  }
  @media (max-width: 640px) {
    #clubs { grid-template-columns: repeat(2, 1fr); }
    .club .d { display: none; }
    .card h1 { font-size: 30px; }
    #hud .title { font-size: 16px; }
  }
</style>
</head>
<body>
  <div id="hud">
    <span class="title" id="hTitle">🏆 Wacky Sports</span>
    <span class="stat"><span id="hUnit">Hole</span> <b id="hHole">1</b>/<span id="hCount">9</span> · <span id="hName"></span></span>
    <span class="stat"><span id="hParL">Par</span> <b id="hPar">3</b></span>
    <span class="stat"><span id="hStrokesL">Strokes</span> <b id="hStrokes">0</b></span>
    <span class="stat">Total <b id="hTotal">E</b></span>
    <span><button id="menuBtn" title="Pick another sport">🏠</button> <button id="mute" title="Toggle sound (M)">🔊</button></span>
  </div>

  <div id="wrap">
    <canvas id="c" width="1000" height="640"></canvas>
    <div id="toast"></div>

    <div class="screen show" id="titleScreen">
      <div class="card">
        <div class="big-emoji">🦆🐟🍕</div>
        <h1>Wacky Sports</h1>
        <p>No balls. No clubs. Just a rubber duck, a wet fish, and your dignity.</p>
        <div class="sports" id="sportGrid"></div>
        <p class="small">Drag anywhere to pull back and aim, release to swing.<br>Pick a club with the buttons below or keys 1–4.</p>
      </div>
    </div>

    <div class="screen" id="introScreen">
      <div class="card">
        <p class="small" id="introHole"></p>
        <h2 id="introName"></h2>
        <div class="big-emoji" id="introEmoji"></div>
        <p id="introWhat"></p>
        <p id="introDesc"></p>
        <p class="small" id="introTip"></p>
        <button class="btn" id="introBtn">Let's go</button>
      </div>
    </div>

    <div class="screen" id="endScreen">
      <div class="card">
        <div class="big-emoji" id="endEmoji">🏆</div>
        <h2 id="endTitle"></h2>
        <p id="endLine"></p>
        <table class="score" id="scoreTable"></table>
        <button class="btn" id="againBtn">Play again</button>
        <button class="btn alt" id="menuBtn2">Other sports</button>
      </div>
    </div>
  </div>

  <div id="clubs"></div>
  <div id="item"></div>

<script>
(() => {
"use strict";

const W = 1000, H = 640, B = 20; // field size and border thickness
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const $ = id => document.getElementById(id);

// ---------- Things you hit ----------
// damp: speed kept per 1/60 s. bounce: wall restitution. power: shot strength multiplier.
const ITEMS = {
  duck:   { emoji: '🦆', name: 'Rubber Duck',  r: 16, bounce: .7,  damp: .985, power: 1,    desc: 'Floats! Water only slows it down.', floats: true },
  egg:    { emoji: '🥚', name: 'Raw Egg',      r: 14, bounce: .45, damp: .986, power: 1,    desc: 'Fragile. Smack a wall too hard and it cracks (+1 stroke).', fragile: true },
  pizza:  { emoji: '🍕', name: 'Pizza Slice',  r: 16, bounce: .25, damp: .962, power: 1.15, desc: 'Greasy and sticky. Barely slides. Use the speed pads.' },
  donut:  { emoji: '🍩', name: 'Glazed Donut', r: 16, bounce: .6,  damp: .993, power: .85,  desc: 'Slippery glaze. It slides basically forever.' },
  melon:  { emoji: '🍉', name: 'Watermelon',   r: 22, bounce: .3,  damp: .988, power: .8,   desc: 'Heavy. Bumpers barely move it.', heavy: true },

  sock:   { emoji: '🧦', name: 'Lost Sock',    r: 15, bounce: .15, damp: .98,  power: 1.05, desc: 'Floppy. Zero bounce.' },
  cheese: { emoji: '🧀', name: 'Bouncy Cheese',r: 16, bounce: 1.08,damp: .987, power: .95,  desc: 'Somehow speeds UP when it hits a wall.' },
  banana: { emoji: '🍌', name: 'Banana',       r: 16, bounce: .55, damp: .986, power: 1,    desc: 'Curves on its own. It is shaped that way.', curve: 1 },
};

// ---------- Things you hit them with ----------
const CLUBS = [
  { emoji: '🥖', name: 'Baguette',       desc: 'Crusty. Reliable. French.',          power: 1 },
  { emoji: '🐟', name: 'Wet Fish',       desc: 'Huge slap, terrible aim.',           power: 1.35, wobble: .4 },
  { emoji: '🍳', name: 'Frying Pan',     desc: 'Lobs it over water and sand.',       power: .95, lob: true },
  { emoji: '🐔', name: 'Rubber Chicken', desc: 'Curves the shot. Which way? Unclear.', power: 1, chicken: true },
];

// ---------- Course ----------
// walls/water/sand/boosts: [x, y, w, h(, angle)], bumpers: [x, y, r],
// mills: [x, y, armLength, radPerSec], movers: [x, y, w, h, dx, dy, periodSec, phase]
const HOLES = [
  { name: 'Duck Pond Drive', item: 'duck', par: 2, start: [130, 320], cup: [870, 320],
    water: [[360, 110, 280, 420]], walls: [[300, 20, 24, 120], [300, 500, 24, 120]], bumpers: [[760, 200, 26], [760, 440, 26]],
    tip: 'Ducks float. Just send it straight through the pond.' },
  { name: 'Eggshell Alley', item: 'egg', par: 4, start: [110, 540], cup: [880, 530],
    walls: [[230, 190, 30, 430], [490, 20, 30, 430], [740, 190, 30, 430]],
    tip: 'Gentle shots. Nobody likes scrambled eggs on the green.' },
  { name: 'Speedy Pizza Delivery', item: 'pizza', par: 3, start: [100, 320], cup: [900, 320],
    boosts: [[200, 270, 140, 100, 0], [520, 270, 140, 100, 0]],
    sand: [[380, 100, 110, 160], [380, 380, 110, 160]],
    walls: [[720, 20, 24, 240], [720, 380, 24, 240]],
    tip: 'Pizza is sticky. The orange speed pads help a lot.' },
  { name: 'Windmill of Doom', item: 'donut', par: 3, start: [120, 320], cup: [870, 320],
    walls: [[440, 20, 120, 170], [440, 450, 120, 170], [930, 20, 50, 600]],
    mills: [[500, 320, 125, 1.6]],
    sand: [[760, 120, 170, 90], [760, 430, 170, 90]],
    tip: 'Time the windmill. The donut will not stop on its own.' },
  { name: 'Melon Pinball', item: 'melon', par: 3, start: [120, 520], cup: [870, 130],
    bumpers: [[340, 200, 34], [340, 440, 34], [520, 320, 34], [700, 200, 34], [700, 440, 34], [520, 110, 28], [520, 530, 28]],
    tip: 'A watermelon has no fear of bumpers.' },
  { name: 'Frog Bog', item: 'frog', par: 4, start: [100, 320], cup: [890, 110],
    water: [[200, 20, 580, 250], [200, 380, 580, 240], [780, 200, 120, 60]],
    tip: 'Narrow bridge. Frogs hop. You see the problem. (The frying pan can lob over water.)' },
  { name: 'The Sock Drawer', item: 'sock', par: 3, start: [110, 320], cup: [890, 320],
    movers: [[300, 30, 30, 190, 0, 390, 2.6, 0], [500, 30, 30, 190, 0, 390, 2.0, 2], [700, 30, 30, 190, 0, 390, 1.6, 4]],
    tip: 'The drawers open and close. Socks get lost in there.' },
  { name: 'Cheese Ricochet', item: 'cheese', par: 3, start: [120, 320], cup: [830, 320],
    walls: [[440, 150, 30, 340], [740, 220, 24, 200], [740, 220, 150, 24], [740, 396, 150, 24]],
    tip: 'The cup is boxed in from the left. Bank it in from the right side.' },
  { name: 'The Grand Banana', item: 'banana', par: 5, start: [100, 540], cup: [890, 100],
    water: [[290, 400, 260, 220]], sand: [[620, 20, 120, 150]],
    walls: [[640, 300, 340, 26]], mills: [[480, 200, 105, -2.1]],
    movers: [[790, 30, 24, 120, 0, 150, 2.2, 0]],
    boosts: [[110, 160, 100, 140, 0]],
    tip: 'Everything at once. The banana curves. Good luck.' },
];

// ---------- More sports ----------
Object.assign(ITEMS, {
  pumpkin: { emoji: '🎃', name: 'Pumpkin',       r: 20, bounce: .3,  damp: .988, power: .95, mass: 3,   desc: 'Heavy and roundish. Built for bowling.' },
  coconut: { emoji: '🥥', name: 'Coconut',       r: 17, bounce: .5,  damp: .99,  power: 1,   mass: 2.2, desc: 'Hard as a rock. Rolls true.' },
  turtle:  { emoji: '🐢', name: 'Turtle',        r: 18, bounce: .3,  damp: .978, power: 1.15,mass: 2.6, desc: 'Stubborn and surprisingly heavy.' },
  burger:  { emoji: '🍔', name: 'Burger',        r: 17, bounce: .4,  damp: .984, power: 1,   desc: 'Juicy. Kicks like a dream.' },
  puffer:  { emoji: '🐡', name: 'Pufferfish',    r: 18, bounce: 1.0, damp: .986, power: .95, desc: 'Spiky and VERY bouncy.' },
  yarn:    { emoji: '🧶', name: 'Ball of Yarn',  r: 16, bounce: .3,  damp: .98,  power: 1.05,desc: 'Soft. Barely bounces.' },
  orange:  { emoji: '🍊', name: 'Orange',        r: 15, bounce: .6,  damp: .985, power: 1,   desc: 'Basically a basketball. Basically.' },
  bagel:   { emoji: '🥯', name: 'Bagel',         r: 16, bounce: .4,  damp: .982, power: 1.05,desc: 'Already has a hole. Wants another.' },
  hamster: { emoji: '🐹', name: 'Hamster',       r: 15, bounce: .5,  damp: .982, power: 1.1, desc: 'Light and zippy. Wheee!' },
  teapot:  { emoji: '🫖', name: 'Teapot',        r: 18, bounce: .3,  damp: .982, power: .95, mass: 2.5, desc: 'Heavy. Hard to knock away.' },
  penguin: { emoji: '🐧', name: 'Penguin',       r: 17, bounce: .4,  damp: .99,  power: .85, mass: 1.5, desc: 'Belly-slides a LONG way.' },
  butter:  { emoji: '🧈', name: 'Stick of Butter', r: 16, bounce: .2, damp: .993, power: .8, desc: 'Ridiculously slippery.' },
  icecube: { emoji: '🧊', name: 'Ice Cube',      r: 15, bounce: .5,  damp: .99,  power: .9,  desc: 'Right at home on the ice.' },
});
ITEMS.melon.mass = 3;

// Ten pins in a triangle pointing at the thrower.
function pinset(emoji, hx = 750, cy = 320, gap = 34) {
  const p = [];
  for (let row = 0; row < 4; row++) for (let k = 0; k <= row; k++) p.push([hx + row * 33, cy + (k - row / 2) * gap, emoji]);
  return p;
}
// movers with a 9th entry are characters (goalies, ducks...) drawn as that emoji
const LANE = { theme: 'lane', start: [120, 320], pits: [[20, 20, 960, 192], [20, 428, 960, 192], [925, 20, 55, 600]] };
const BOWLING = [
  { ...LANE, name: 'Juice Box Lanes', item: 'melon', pins: pinset('🧃'), tip: 'Aim for the front pin, just a little off-center.' },
  { ...LANE, name: 'Bottle Bash', item: 'pumpkin', pins: pinset('🍾'), tip: 'Pumpkins are heavy. Let it rip.' },
  { ...LANE, name: 'Flamingo Formation', item: 'coconut', pins: pinset('🦩'), bumpers: [[500, 320, 22]], tip: 'There is a bumper in the lane. Go around it, or off it.' },
  { ...LANE, name: 'Duck Crossing', item: 'turtle', pins: pinset('🥫'), movers: [[440, 222, 40, 40, 0, 156, 2.4, 0, '🦆']], tip: 'A duck is crossing the lane. Time it.' },
  { ...LANE, name: 'Stone Heads', item: 'duck', pins: pinset('🗿'), pinMass: 1.8, tip: 'Heavy stone heads and a rubber duck. Good luck.' },
];

const PITCH = { theme: 'pitch', goal: [945, 232, 35, 176], walls: [[915, 212, 65, 20], [915, 408, 65, 20]] };
const SOCCER = [
  { ...PITCH, name: 'Crab Keeper', items: ['burger', 'yarn', 'burger', 'puffer', 'burger'],
    spots: [[640, 320], [600, 230], [600, 410], [540, 320], [560, 260]],
    movers: [[900, 268, 30, 56, 0, 84, 2.4, 0, '🦀']], tip: 'The crab shuffles up and down. Shoot for the gap.' },
  { ...PITCH, name: 'Penguin Wall', items: ['yarn', 'burger', 'puffer', 'yarn', 'burger'],
    spots: [[520, 320], [500, 220], [500, 420], [460, 300], [440, 360]],
    movers: [[900, 262, 30, 62, 0, 84, 1.7, 1, '🐙'], [740, 230, 30, 34, 0, 150, 2.6, 0, '🐧'], [740, 376, 30, 34, 0, -150, 2.6, 0, '🐧']],
    tip: 'The penguins guard the middle. Bank it off a wall if you dare.' },
  { ...PITCH, name: 'Gorilla in the Net', items: ['puffer', 'burger', 'yarn', 'puffer', 'burger'],
    spots: [[460, 320], [440, 200], [440, 440], [400, 320], [380, 250]],
    movers: [[896, 258, 36, 74, 0, 76, 1.4, 2, '🦍']], mills: [[680, 320, 80, 2.2]],
    tip: 'A sprinkler AND a gorilla. Curve one in with the chicken.' },
];

const COURT = { theme: 'court', hoop: { x: 860, y: 320, r: 26 }, lob: true };
const HOOPS = [
  { ...COURT, name: 'Fruit Free Throws', items: ['orange', 'orange', 'orange', 'orange', 'orange'],
    spots: [[600, 320], [560, 220], [560, 420], [500, 320], [420, 320, true]],
    tip: 'Every shot is a lob. The dashed circle shows where it will land.' },
  { ...COURT, name: 'Moving Hoop', hoop: { x: 860, y: 220, r: 26, move: [0, 200, 3.4] }, items: ['bagel', 'orange', 'bagel', 'orange', 'bagel'],
    spots: [[580, 320], [520, 200], [520, 440], [430, 320, true], [400, 210, true]],
    tip: 'The hoop slides up and down. Lead your shot.' },
  { ...COURT, name: 'Hamster Dunk Contest', hoop: { x: 820, y: 220, r: 24, move: [70, 200, 2.6] }, items: ['hamster', 'hamster', 'orange', 'hamster', 'bagel'],
    spots: [[560, 320], [500, 180], [500, 460], [420, 320, true], [380, 440, true]],
    tip: 'The hoop is on the move and the hamsters are excited.' },
];

const SHEET = { theme: 'ice', ice: true, start: [100, 320], house: [800, 320], hog: 470, pits: [[930, 20, 50, 600]] };
const CURLING = [
  { ...SHEET, name: 'Tea Time', items: ['teapot', 'penguin', 'teapot', 'penguin'],
    tip: 'Stop on the target: 3 points for the middle, 2 and 1 further out. It must pass the red line.' },
  { ...SHEET, name: 'Guarded House', items: ['butter', 'icecube', 'butter', 'icecube'], stones: [[640, 290], [650, 355]],
    tip: 'Grey rocks are in the way. Curve around them with the chicken.' },
  { ...SHEET, name: 'Penguin Party', items: ['penguin', 'teapot', 'icecube', 'butter'], stones: [[790, 320], [860, 250], [760, 410]], bumpers: [[600, 410, 22]],
    tip: 'A rock is sitting on the button. Knock it out!' },
];

const SPORTS = {
  golf:    { key: 'golf', emoji: '⛳', name: 'Wacky Golf', unit: 'Hole', levels: HOLES, golf: true, verb: 'hitting',
             blurb: 'Nine holes. Fewest strokes wins.' },
  bowling: { key: 'bowling', emoji: '🎳', name: 'Wacky Bowling', unit: 'Frame', levels: BOWLING, shots: 2, verb: 'bowling a', max: 100,
             blurb: 'Five frames of knocking things over.' },
  soccer:  { key: 'soccer', emoji: '⚽', name: 'Wacky Penalties', unit: 'Round', levels: SOCCER, verb: 'kicking', max: 15,
             blurb: 'Get it past the goalie. Any goalie.' },
  hoops:   { key: 'hoops', emoji: '🏀', name: 'Wacky Hoops', unit: 'Round', levels: HOOPS, verb: 'shooting', max: 39,
             blurb: 'Everything is a lob. Land it in the hoop.' },
  curling: { key: 'curling', emoji: '🥌', name: 'Wacky Curling', unit: 'End', levels: CURLING, verb: 'sliding', max: 36,
             blurb: 'Slide it onto the target. On ice.' },
};

// ---------- Commentary ----------
const LINES = {
  splash: ['Splash! That one is sleeping with the fishes.', 'Glub glub. +1 stroke.', 'It did not float. +1 stroke.'],
  crack:  ['CRACK! Omelette time. +1 stroke.', 'The egg has perished. +1 stroke.', 'Scrambled. +1 stroke.'],
  hop:    ['The frog hopped. Nobody told it to.', 'Ribbit. (The frog moved.)', 'The frog has made a choice.'],
  squawk: ['BAWK!', 'The chicken has spoken.', 'Squeeeak!'],
  duckwater: ['The duck is having a lovely swim.', 'Quack. Unbothered.'],
  lip:    ['Lipped out! Too fast.', 'So close. Slow down a bit.'],

// ---------- Shooting ----------
function shoot({ ang, power }) {

  ball.spin = club.chicken ? (Math.random() < .5 ? -1 : 1) * (1.2 + Math.random() * .8) : 0;
  ball.air = 0;

  else if (club.lob) { ball.airT = .35 + .55 * power; ball.air = ball.airT; }

// ---------- Particles ----------

}

  for (let i = 0; i < 110; i++) {
    const a = Math.random() * Math.PI * 2, s = 150 + Math.random() * 450;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1.6, max: 1.6, color: pick(cols),

function ring(x, y, color, max = 40, life = .45, width = 3) { rings.push({ x, y, color, max, life, t: life, width }); }

// ---------- Physics ----------
function collideRect(r, mv) {

function bounce(nx, ny, vn, rvx, rvy, ux, uy) {

  ball.vy = rvy - (1 + e) * vn * ny + uy;

  const s = Math.hypot(ball.vx, ball.vy);

    if (!ball.moving && state === 'play') idle(dt);
    return;
  }

  const wasAir = ball.air > 0;
  if (ball.air > 0) {

    if (Math.random() < .3) puff(ball.x, ball.y, '#ffb36b', 60);

    } else {

    if (d < 13 && sp >= 520 && !ball.lipped) { ball.lipped = true; toast(pick(LINES.lip), 1200); ball.vx += -dy / d * 60; ball.vy += dx / d * 60; }
    if (d >= 13) ball.lipped = false;
    if (d < 34 && sp < 380) { ball.vx += dx / d * 700 * dt; ball.vy += dy / d * 700 * dt; }
  }

  if (!air && !onBoost && sp < 7) {
    ball.vx = ball.vy = 0; ball.moving = false; ball.stopT = 0; ball.spin = 0;
    checkGiveUp();
  }
}

function idle(dt) {
  ball.stopT += dt;
  if (item.hops && !ball.hopped && ball.stopT > .7) {
    ball.hopped = true;
    if (Math.random() < .5) {
      const a = Math.random() * Math.PI * 2;
      ball.vx = Math.cos(a) * 260; ball.vy = Math.sin(a) * 260;
      ball.air = .3; ball.airT = .3; ball.moving = true; ball.last = [ball.x, ball.y];
      sfx.ribbit(); toast(pick(LINES.hop), 1300);
    }
  }
}

function sink() {
  state = 'sinking'; sinkAnim = 0; ball.moving = false;
  ball.vx = ball.vy = 0;
  sfx.sink(); confetti(hole.cup[0], hole.cup[1]); shake = 6;
  ring(hole.cup[0], hole.cup[1], 'rgba(255,214,61,.95)', 90, .7, 6); ring(hole.cup[0], hole.cup[1], 'rgba(255,255,255,.8)', 60, .5, 3);
  const d = strokes - hole.par;
  const names = { '-3': 'Albatross!', '-2': 'Eagle!', '-1': 'Birdie!', '0': 'Par.', '1': 'Bogey.', '2': 'Double bogey.' };
  const msg = strokes === 1 ? `HOLE IN ONE with a ${item.name.toLowerCase()}!` : (names[d] || (d > 0 ? `+${d}. The ${item.name.toLowerCase()} made it eventually.` : 'Incredible!'));
  toast(msg, 2200);
  setTimeout(() => finishHole(strokes), 1700);
}

function finishHole(s) {
  if (state === 'end' || scores.length > holeIdx) return;
  state = 'between';
  scores.push(s); updateHud();
  setTimeout(() => {
    if (holeIdx + 1 < LEVELS.length) loadHole(holeIdx + 1);
    else endGame();
  }, s === 10 && strokes >= 10 ? 1600 : 300);
}

function endGame() {
  state = 'end';
  const total = scores.reduce((a, b) => a + b, 0), best = getBest(sport.key);
  const better = best === null || (sport.golf ? total < best : total > best);
  try { if (better) localStorage.setItem(bestKey(sport.key), total); } catch (e) {}
  let rows;
  if (sport.golf) {
    const par = HOLES.reduce((a, h) => a + h.par, 0), d = total - par;
    $('endEmoji').textContent = d <= -3 ? '🏆' : d <= 0 ? '🥇' : d <= 6 ? '🥈' : '🫠';
    $('endTitle').textContent = `${total} strokes (${fmtPar(d)})`;
    $('endLine').textContent = d <= 0 ? 'A true master of hitting food with fish.' : d <= 6 ? 'Respectable. The duck is proud of you.' : 'The items have filed a complaint.';
    rows = '<tr><th>Hole</th><th></th><th>Par</th><th>You</th></tr>';
    HOLES.forEach((h, i) => rows += `<tr><th>${i + 1}. ${h.name}</th><td>${ITEMS[h.item].emoji}</td><td>${h.par}</td><td>${scores[i]}</td></tr>`);
    rows += `<tr><th>Total</th><td></td><td>${par}</td><td><b>${total}</b></td></tr>`;
  } else {
    const f = total / sport.max;
    $('endEmoji').textContent = f >= .6 ? '🏆' : f >= .35 ? '🥇' : f >= .15 ? '🥈' : '🫠';
    $('endTitle').textContent = `${total} points`;
    $('endLine').textContent = f >= .6 ? 'Legendary. The penguins will sing of this.' : f >= .35 ? 'Solid work. The fish approves.' : f >= .15 ? 'Not bad for someone holding a baguette.' : 'The items have filed a complaint.';
    rows = `<tr><th>${sport.unit}</th><th></th><th></th><th>Points</th></tr>`;
    LEVELS.forEach((h, i) => rows += `<tr><th>${i + 1}. ${h.name}</th><td>${[...new Set(h.items || [h.item])].map(k => ITEMS[k].emoji).join('')}</td><td></td><td>${scores[i]}</td></tr>`);
    rows += `<tr><th>Total</th><td></td><td></td><td><b>${total}</b></td></tr>`;
  }
  if (better && best !== null) rows += `<tr><td colspan="4" class="small">New personal best! (old: ${best})</td></tr>`;
  else if (!better) rows += `<tr><td colspan="4" class="small">Your best: ${best}</td></tr>`;
  $('scoreTable').innerHTML = rows;
  show('endScreen');
}

// ---------- Pins, stones and other things that get knocked around ----------
const iceDamp = d => 1 - (1 - d) * .6;
function makeBody(x, y, emoji, r, mass, damp, kind) {
  return { x, y, vx: 0, vy: 0, r, emoji, mass, damp, kind, rot: 0, down: false, gone: false, fall: 0 };
}
// push two circles apart and bounce them off each other, respecting mass
function collideCircles(a, b, e) {
  const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy), min = a.r + b.r;
  if (d >= min || d < 1e-6) return 0;
  const nx = dx / d, ny = dy / d, ov = min - d, tot = a.mass + b.mass;
  a.x -= nx * ov * b.mass / tot; a.y -= ny * ov * b.mass / tot;
  b.x += nx * ov * a.mass / tot; b.y += ny * ov * a.mass / tot;
  const rv = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
  if (rv >= 0) return 0;
  const j = -(1 + e) * rv / (1 / a.mass + 1 / b.mass);
  a.vx -= j * nx / a.mass; a.vy -= j * ny / a.mass;
  b.vx += j * nx / b.mass; b.vy += j * ny / b.mass;
  return -rv;
}
function bodyRect(b, r, mv) {
  const cx = clamp(b.x, r[0], r[0] + r[2]), cy = clamp(b.y, r[1], r[1] + r[3]);
  const dx = b.x - cx, dy = b.y - cy, d = Math.hypot(dx, dy);
  if (d >= b.r || d < 1e-6) return;
  const nx = dx / d, ny = dy / d, ux = mv ? mv[0] : 0, uy = mv ? mv[1] : 0;
  b.x += nx * (b.r - d); b.y += ny * (b.r - d);
  const vn = (b.vx - ux) * nx + (b.vy - uy) * ny;
  if (vn < 0) { b.vx -= 1.5 * vn * nx; b.vy -= 1.5 * vn * ny; }
}
function stepBodies(dt) {
  if (!bodies.length) return;
  for (const b of bodies) {
    if (b.gone) continue;
    const s = Math.hypot(b.vx, b.vy);
    if (s > 0) {
      const f = Math.pow(b.damp, dt * 60) * Math.max(0, 1 - (hole.ice ? 22 : 40) * dt / s);
      b.vx *= f; b.vy *= f;
    }
    b.x += b.vx * dt; b.y += b.vy * dt;
    for (const r of border) bodyRect(b, r);
    for (const r of hole.walls) bodyRect(b, r);
    for (const m of hole.movers) bodyRect(b, moverRect(m, time), moverVel(m, time));
    for (const bm of hole.bumpers) {
      const p = { x: bm[0], y: bm[1], r: bm[2], vx: 0, vy: 0, mass: 1e6 };
      if (collideCircles(p, b, .9) > 30) { bm.flash = .2; sfx.boing(); }
    }
    if (hole.pits.some(r => inRect(b.x, b.y, r))) { b.gone = true; b.down = true; }
    if (b.kind === 'pin' && !b.down && Math.hypot(b.vx, b.vy) > 60) {
      b.down = true; b.fall = Math.atan2(b.vy, b.vx);
      tone(500 + Math.random() * 400, .07, 'triangle', .12, 250);
    }
  }
  for (let i = 0; i < bodies.length; i++) for (let j = i + 1; j < bodies.length; j++) {
    const a = bodies[i], b = bodies[j];
    if (a.gone || b.gone) continue;
    if (collideCircles(a, b, .7) > 80) tone(700 + Math.random() * 300, .04, 'square', .05);
  }
  if (!ball.gone && !(ball.air > 0)) for (const b of bodies) {
    if (b.gone) continue;
    const hit = collideCircles(ball, b, .75);
    if (hit > 0) {
      if (hit > 80) { ring(b.x, b.y, 'rgba(255,255,255,.8)', 26, .3, 2); sfx.wall(hit * 2); }
      if (Math.hypot(ball.vx, ball.vy) > 5) ball.moving = true;
    }
  }
}
const bodiesResting = () => bodies.every(b => b.gone || Math.hypot(b.vx, b.vy) < 6);

function hoopPos() {
  const h = hole.hoop;
  if (!h.move) return [h.x, h.y];
  const k = .5 - .5 * Math.cos(2 * Math.PI * time / h.move[2]);
  return [h.x + h.move[0] * k, h.y + h.move[1] * k];
}
const shotsTotal = () => hole.items ? hole.items.length : (sport.shots || 1);
function spotFor(k) {
  const s = hole.spots ? hole.spots[k % hole.spots.length] : hole.start;
  return [s[0], s[1]];
}
function curlingScore() {
  const [hx, hy] = hole.house;
  let pts = 0;
  for (const b of bodies) {
    if (b.gone || b.kind !== 'stone') continue;
    const d = Math.hypot(b.x - hx, b.y - hy);
    pts += d < 36 ? 3 : d < 70 ? 2 : d < 104 ? 1 : 0;
  }
  return pts;
}
function floater(text, x, y, color = '#ffd23d') { floaters.push({ text, x, y, t: 1.3, color }); }

function scorePoints(pts, msg, x, y) {
  roundPts += pts; updateHud();
  floater('+' + pts, x, y - 30);
  toast(msg, 1500);
  sfx.sink(); confetti(x, y); shake = 5;
  ring(x, y, 'rgba(255,214,61,.95)', 80, .6, 5);
}
function ballOut(msg) {
  toast(msg, 1300);
  tone(160, .2, 'sine', .15, 60);
  ball.gone = true; ball.moving = false; ball.vx = ball.vy = 0;
}
function checkHoop() {
  const [hx, hy] = hoopPos(), d = Math.hypot(ball.x - hx, ball.y - hy), r = hole.hoop.r;
  if (d < r) {
    const far = hole.spots[(shotIdx) % hole.spots.length][2];
    ball.scored = true; ball.gone = true; ball.moving = false;
    scorePoints(far ? 3 : 2, d < r * .45 ? (far ? 'SWISH from downtown!' : 'SWISH!') : (far ? 'Three!' : 'Bucket!'), hx, hy);
  } else if (d < r + 14) {
    toast(pick(['Off the rim!', 'Rattled out!', 'So close!']), 1200);
    const nx = (ball.x - hx) / d, ny = (ball.y - hy) / d;
    ball.vx = nx * 260; ball.vy = ny * 260; sfx.wall(500);
    ring(hx, hy, 'rgba(255,140,40,.9)', 30, .3, 3);
  }
}

function resolveShot() {
  shotActive = false; shotIdx++;
  for (const b of bodies) b.vx = b.vy = 0;
  if (sport.key === 'bowling') {
    const down = bodies.filter(b => b.kind === 'pin' && b.down && !b.counted);
    down.forEach(b => b.counted = true);
    const standing = bodies.filter(b => b.kind === 'pin' && !b.down).length;
    let pts = down.length, msg = down.length === 1 ? '1 down.' : down.length ? `${down.length} down!` : pick(['Not a single one.', 'The pins are unimpressed.']);
    if (standing === 0 && shotIdx === 1) { pts += 10; msg = 'STRIKE! +10 bonus'; confetti(820, 320); sfx.sink(); shake = 6; }
    else if (standing === 0) { pts += 5; msg = 'SPARE! +5 bonus'; confetti(820, 320); sfx.sink(); }
    roundPts += pts;
    if (pts) floater('+' + pts, 810, 250);
    toast(msg, 1500);
    bodies = bodies.filter(b => !b.down);
    if (standing === 0 || shotIdx >= 2) return endRound();
  } else if (sport.key === 'curling') {
    if (!ball.gone) {
      if (ball.x < hole.hog) toast("Didn't pass the red line. Removed.", 1500);
      else {
        const before = roundPts;
        bodies.push(makeBody(ball.x, ball.y, item.emoji, item.r, ball.mass, iceDamp(item.damp), 'stone'));
        roundPts = curlingScore();
        if (roundPts > before) { floater('+' + (roundPts - before), ball.x, ball.y - 30); sfx.sink(); }
      }
    }
    roundPts = curlingScore();
    if (shotIdx >= shotsTotal()) return endRound();
  } else {
    if (!ball.scored) toast(pick(sport.key === 'soccer' ? ['Saved!', 'Wide!', 'Denied!', 'The keeper says no.'] : ['Brick!', 'Airball!', 'Nothing but floor.']), 1300);
    if (shotIdx >= shotsTotal()) return endRound();
  }
  setItem(hole.items ? hole.items[shotIdx % hole.items.length] : hole.item);
  placeBall(...spotFor(shotIdx));
  updateHud();
}

function endRound() {
  state = 'between'; updateHud();
  setTimeout(() => finishHole(roundPts), 1500);
}

  c.fillStyle = '#222'; roundRect(sx - 46, sy - 22, 12, 18, 3, c); c.fill(); roundRect(sx - 46, sy + 4, 12, 18, 3, c); c.fill();
  // frost around the edge
  g = c.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, W * .7);
  g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(1, 'rgba(255,255,255,.4)');
  c.fillStyle = g; c.fillRect(0, 0, W, H);
}

function drawBodies() {
  for (const b of bodies) {
    if (b.gone) continue;
    ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(b.x + 3, b.y + 5, b.r, b.r * .6, 0, 0, TAU); ctx.fill();
    if (b.kind === 'stone') { ctx.strokeStyle = '#ffd23d'; ctx.lineWidth = 3; circle(b.x, b.y, b.r + 4); ctx.stroke(); }
    ctx.globalAlpha = b.down ? .5 : 1;
    emoji(b.emoji, b.x, b.y, b.r * (b.kind === 'pin' ? 2.3 : 2.2), b.down ? b.fall + Math.PI / 2 : 0);
    ctx.globalAlpha = 1;
  }
}

function drawKeeper(m) {
  const r = moverRect(m, time), cx = r[0] + r[2] / 2, cy = r[1] + r[3] / 2, size = Math.max(r[2], r[3]) * 1.05;
  ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(cx + 4, cy + size * .32, size * .42, size * .16, 0, 0, TAU); ctx.fill();
  emoji(m[8], cx, cy + Math.sin(time * 9 + m[7]) * 1.5, size);
}

function drawHoop() {
  const [hx, hy] = hoopPos(), r = hole.hoop.r, bx = hx + r + 10;
  ctx.fillStyle = 'rgba(0,0,0,.22)'; roundRect(bx + 5, hy - 46, 12, 96, 3); ctx.fill();
  ctx.fillStyle = '#9aa0a6'; ctx.fillRect(hx + r - 2, hy - 4, 14, 8);
  ctx.fillStyle = '#fafafa'; roundRect(bx, hy - 50, 12, 100, 3); ctx.fill();
  ctx.strokeStyle = '#e04848'; ctx.lineWidth = 2; ctx.strokeRect(bx + 2, hy - 18, 8, 36);
  ctx.fillStyle = 'rgba(0,0,0,.18)'; circle(hx + 5, hy + 9, r); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 1.3;
  const sway = Math.sin(time * 3) * .15;
  for (let k = 0; k < 14; k++) {
    const a = k * TAU / 14;
    ctx.beginPath(); ctx.moveTo(hx + Math.cos(a) * r, hy + Math.sin(a) * r);
    ctx.lineTo(hx + Math.cos(a + .55 + sway) * r * .45, hy + 5 + Math.sin(a + .55 + sway) * r * .45); ctx.stroke();
  }
  circle(hx, hy + 5, r * .45); ctx.stroke();
  ctx.strokeStyle = '#ff7a1a'; ctx.lineWidth = 4.5; circle(hx, hy, r); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(hx, hy, r - 1, Math.PI * 1.05, Math.PI * 1.5); ctx.stroke();
}

function drawFloaters() {
  ctx.font = '700 30px Fredoka, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const f of floaters) {
    ctx.globalAlpha = Math.min(1, f.t * 2);
    ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(0,0,0,.45)'; ctx.strokeText(f.text, f.x, f.y);
    ctx.fillStyle = f.color; ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
}

// where a lob will land (ignoring wobble and curve)
function lobLanding(ang, power) {
  const club = CLUBS[clubIdx];
  let sp = MAX_SPEED * power * club.power * item.power, dist = 0;
  const T = .45 + .65 * power, f = Math.pow(.997, .5);
  for (let t = 0; t < T; t += 1 / 120) { dist += sp / 120; sp *= f; }
  return [ball.x + Math.cos(ang) * dist, ball.y + Math.sin(ang) * dist, dist];
}

// ---------- Drawing ----------
// Render at the screen's pixel density so everything stays crisp on retina displays.
const DPR = Math.min(2, window.devicePixelRatio || 1);
canvas.width = W * DPR; canvas.height = H * DPR;
// Everything that never moves (grass, sand, walls, cup) is painted once per hole into bg.
const bg = document.createElement('canvas');
bg.width = W * DPR; bg.height = H * DPR;
const bctx = bg.getContext('2d');
const TAU = Math.PI * 2;

function roundRect(x, y, w, h, r, c = ctx, begin = true) {
  r = Math.min(r, w / 2, h / 2);
  if (begin) c.beginPath();
  c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function circle(x, y, r, c = ctx) { c.beginPath(); c.arc(x, y, r, 0, TAU); }
function emoji(ch, x, y, size, rot = 0, sx = 1, sy = 1) {
  ctx.save(); ctx.translate(x, y); ctx.scale(sx, sy); ctx.rotate(rot);
  ctx.font = `${size}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#000';
  ctx.fillText(ch, 0, size * .05);
  ctx.restore();
}
// seeded random so each hole's grass texture looks the same every time
function rng(seed) {
  return () => {
    seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
// dark blurred edge just inside a rounded rect, so it reads as sunken
function innerShadow(c, r, rad, color, blur, offY = 3) {
  c.save();
  roundRect(r[0], r[1], r[2], r[3], rad, c); c.clip();
  c.shadowColor = color; c.shadowBlur = blur * DPR; c.shadowOffsetY = offY * DPR;
  c.fillStyle = '#000';
  c.beginPath(); c.rect(r[0] - 60, r[1] - 60, r[2] + 120, r[3] + 120);
  roundRect(r[0], r[1], r[2], r[3], rad, c, false);
  c.fill('evenodd');
  c.restore();
}

function drawWall(r, c = ctx, style = 'wood') {
  const [x, y, w, h] = r, long = w >= h;
  if (style === 'post') {
    c.save(); c.shadowColor = 'rgba(0,0,0,.35)'; c.shadowBlur = 6 * DPR; c.shadowOffsetX = 3 * DPR; c.shadowOffsetY = 4 * DPR;
    const pg = long ? c.createLinearGradient(x, y, x, y + h) : c.createLinearGradient(x, y, x + w, y);
    pg.addColorStop(0, '#ffffff'); pg.addColorStop(1, '#c9ced4');
    c.fillStyle = pg; roundRect(x, y + h * .2, w, h * .6, h * .3, c); c.fill(); c.restore();
    return;
  }
  c.save();
  c.shadowColor = 'rgba(0,0,0,.38)'; c.shadowBlur = 8 * DPR; c.shadowOffsetX = 3 * DPR; c.shadowOffsetY = 5 * DPR;
  c.fillStyle = '#6e4423'; roundRect(x, y, w, h, 6, c); c.fill();
  c.restore();
  const g = long ? c.createLinearGradient(x, y, x, y + h) : c.createLinearGradient(x, y, x + w, y);
  g.addColorStop(0, '#d9a468'); g.addColorStop(.45, '#b97d45'); g.addColorStop(1, '#8a562b');
  c.fillStyle = g; roundRect(x + 2, y + 2, w - 4, h - 4, 5, c); c.fill();
  c.save(); roundRect(x + 2, y + 2, w - 4, h - 4, 5, c); c.clip();
  // wood grain
  c.strokeStyle = 'rgba(90,50,20,.22)'; c.lineWidth = 1;
  const across = long ? h : w, along = long ? w : h, n = Math.max(1, Math.floor(across / 7));
  for (let i = 1; i <= n; i++) {
    c.beginPath();
    for (let t = 0; t <= along; t += 16) {
      const o = i * across / (n + 1) + Math.sin(t * .045 + i * 2.3) * 1.3;
      long ? c.lineTo(x + t, y + o) : c.lineTo(x + o, y + t);
    }
    c.stroke();
  }
  // plank seams
  c.strokeStyle = 'rgba(55,28,8,.4)'; c.lineWidth = 1.5;
  for (let t = 110; t < along - 20; t += 110) {
    c.beginPath();
    long ? (c.moveTo(x + t, y), c.lineTo(x + t, y + h)) : (c.moveTo(x, y + t), c.lineTo(x + w, y + t));
    c.stroke();
  }
  c.restore();
  c.strokeStyle = 'rgba(255,232,195,.5)'; c.lineWidth = 1.5;
  roundRect(x + 2.75, y + 2.75, w - 5.5, h - 5.5, 4, c); c.stroke();
}

function buildBackground() {
  const c = bctx, R = rng(holeIdx * 977 + 13);
  c.setTransform(DPR, 0, 0, DPR, 0, 0);
  c.clearRect(0, 0, W, H);
  let g;
  const theme = hole.theme || 'grass';
  if (theme === 'lane') paintLane(c, R);
  else if (theme === 'pitch') paintPitch(c, R);
  else if (theme === 'court') paintCourt(c, R);
  else if (theme === 'ice') paintIce(c, R);
  else paintGrass(c, R);
  paintHazards(c, R);
  for (const r of hole.walls) drawWall(r, c, theme === 'pitch' ? 'post' : 'wood');
  for (const r of border) drawWall(r, c);
  // brass corner bolts on the rail
  for (const [bx, by] of [[10, 10], [W - 10, 10], [10, H - 10], [W - 10, H - 10]]) {
    g = c.createRadialGradient(bx - 2, by - 2, 1, bx, by, 6);
    g.addColorStop(0, '#fff3b0'); g.addColorStop(1, '#b8892d');
    c.fillStyle = g; circle(bx, by, 5.5, c); c.fill();
  }
}

function paintGrass(c, R) {
  // grass with a mowed diagonal pattern and little blades
  let g = c.createLinearGradient(0, 0, W, H);
  g.addColorStop(0, '#6cc865'); g.addColorStop(1, '#4aa64b');
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  c.fillStyle = 'rgba(255,255,255,.065)';
  for (let x = -H; x < W + H; x += 90) {
    c.beginPath(); c.moveTo(x, 0); c.lineTo(x + 45, 0); c.lineTo(x + 45 - H * .5, H); c.lineTo(x - H * .5, H); c.fill();
  }
  c.lineWidth = 1.2;
  for (let i = 0; i < 1800; i++) {
    const x = R() * W, y = R() * H;
    c.strokeStyle = R() < .55 ? 'rgba(25,85,30,.2)' : 'rgba(225,255,200,.16)';
    c.beginPath(); c.moveTo(x, y); c.lineTo(x + (R() - .5) * 3, y - 2.5 - R() * 3.5); c.stroke();
  }
  for (let i = 0; i < 18; i++) { // tiny flowers
    const x = 40 + R() * (W - 80), y = 40 + R() * (H - 80);
    c.fillStyle = R() < .5 ? 'rgba(255,255,255,.8)' : 'rgba(255,230,90,.8)';
    for (let k = 0; k < 5; k++) { const a = k * TAU / 5; circle(x + Math.cos(a) * 2.2, y + Math.sin(a) * 2.2, 1.5, c); c.fill(); }
    c.fillStyle = '#ffb703'; circle(x, y, 1.2, c); c.fill();
  }
}

function paintHazards(c, R) {
  let g;

  // darker fringe around hazards
  c.fillStyle = 'rgba(30,95,38,.32)';
  for (const r of [...hole.water, ...hole.sand]) { roundRect(r[0] - 8, r[1] - 8, r[2] + 16, r[3] + 16, 32, c); c.fill(); }

  // sand traps
  for (const r of hole.sand) {
    g = c.createLinearGradient(r[0], r[1], r[0] + r[2], r[1] + r[3]);
    g.addColorStop(0, '#f8e7b4'); g.addColorStop(1, '#e2c37f');
    c.fillStyle = g; roundRect(r[0], r[1], r[2], r[3], 30, c); c.fill();
    c.save(); roundRect(r[0], r[1], r[2], r[3], 30, c); c.clip();
    for (let i = 0; i < r[2] * r[3] / 30; i++) {
      c.fillStyle = R() < .5 ? 'rgba(150,110,50,.22)' : 'rgba(255,255,255,.4)';
      c.fillRect(r[0] + R() * r[2], r[1] + R() * r[3], 1.6, 1.6);
    }
    c.strokeStyle = 'rgba(165,125,65,.2)'; c.lineWidth = 2;
    for (let y = r[1] + 12; y < r[1] + r[3]; y += 11) {
      c.beginPath(); for (let x = r[0]; x <= r[0] + r[2]; x += 6) c.lineTo(x, y + Math.sin(x / 16) * 2.5); c.stroke();
    }
    c.restore();
    innerShadow(c, r, 30, 'rgba(110,75,25,.55)', 10);
  }

  // water basins (the moving surface is drawn every frame)
  for (const r of hole.water) {
    g = c.createLinearGradient(r[0], r[1], r[0], r[1] + r[3]);
    g.addColorStop(0, '#2a74bd'); g.addColorStop(1, '#4aa3e3');
    c.fillStyle = g; roundRect(r[0], r[1], r[2], r[3], 24, c); c.fill();
    innerShadow(c, r, 24, 'rgba(5,30,70,.7)', 16, 5);
  }

  // speed pads base
  for (const bz of hole.boosts) {
    c.save(); c.shadowColor = 'rgba(0,0,0,.25)'; c.shadowBlur = 6 * DPR; c.shadowOffsetY = 2 * DPR;
    g = c.createLinearGradient(bz[0], bz[1], bz[0] + bz[2], bz[1]);
    g.addColorStop(0, '#ff7a2f'); g.addColorStop(1, '#ffb347');
    c.fillStyle = g; roundRect(bz[0], bz[1], bz[2], bz[3], 12, c); c.fill(); c.restore();
    c.strokeStyle = 'rgba(255,255,255,.75)'; c.lineWidth = 2.5; roundRect(bz[0] + 3, bz[1] + 3, bz[2] - 6, bz[3] - 6, 10, c); c.stroke();
  }

  if (!hole.cup) return;
  // tee box
  const [tx, ty] = hole.start;
  c.save(); c.shadowColor = 'rgba(0,0,0,.25)'; c.shadowBlur = 6 * DPR; c.shadowOffsetY = 2 * DPR;
  c.fillStyle = '#3c9a45'; roundRect(tx - 34, ty - 34, 68, 68, 12, c); c.fill(); c.restore();
  c.fillStyle = 'rgba(255,255,255,.07)';
  for (let i = 0; i < 4; i++) c.fillRect(tx - 34 + i * 17, ty - 32, 8.5, 64);
  c.strokeStyle = 'rgba(255,255,255,.45)'; c.lineWidth = 2; c.setLineDash([6, 5]);
  roundRect(tx - 29, ty - 29, 58, 58, 9, c); c.stroke(); c.setLineDash([]);

  // the green around the cup, and the cup itself
  const [cx, cy] = hole.cup;
  g = c.createRadialGradient(cx, cy, 12, cx, cy, 52);
  g.addColorStop(0, 'rgba(140,225,130,.95)'); g.addColorStop(1, 'rgba(140,225,130,0)');
  c.fillStyle = g; circle(cx, cy, 52, c); c.fill();
  c.strokeStyle = 'rgba(255,255,255,.12)'; c.lineWidth = 1;
  for (let k = 22; k < 46; k += 6) { circle(cx, cy, k, c); c.stroke(); }
  g = c.createRadialGradient(cx - 4, cy - 5, 1, cx, cy, 16);
  g.addColorStop(0, '#000'); g.addColorStop(.75, '#151515'); g.addColorStop(1, '#3d3d3d');
  c.fillStyle = g; circle(cx, cy, 15.5, c); c.fill();
  c.strokeStyle = 'rgba(255,255,255,.85)'; c.lineWidth = 2;
  c.beginPath(); c.arc(cx, cy, 15.5, .1 * Math.PI, .95 * Math.PI); c.stroke();

  // soft vignette on the grass
  g = c.createRadialGradient(W / 2, H / 2, H * .3, W / 2, H / 2, W * .72);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,35,5,.28)');
  c.fillStyle = g; c.fillRect(0, 0, W, H);
}

function drawWaterSurface(r) {
  const [x, y, w, h] = r;
  ctx.save(); roundRect(x, y, w, h, 24); ctx.clip();
  ctx.strokeStyle = 'rgba(255,255,255,.2)'; ctx.lineWidth = 2;
  for (let yy = y + 16; yy < y + h; yy += 24) {
    ctx.beginPath();
    for (let xx = x - 10; xx <= x + w + 10; xx += 8) ctx.lineTo(xx, yy + Math.sin(xx / 24 + time * 1.7 + yy * .31) * 3.5);
    ctx.stroke();
  }
  const n = Math.floor(w * h / 7000);
  for (let i = 0; i < n; i++) {
    const a = Math.sin(time * 2.5 + i * 1.93);
    if (a < .4) continue;
    const sx = x + (i * 137.5 + 11) % w, sy = y + (i * 89.7 + i * i * 3.1) % h;
    ctx.fillStyle = `rgba(255,255,255,${((a - .4) * 1.4).toFixed(2)})`;
    ctx.beginPath(); ctx.moveTo(sx, sy - 4); ctx.lineTo(sx + 1.2, sy); ctx.lineTo(sx, sy + 4); ctx.lineTo(sx - 1.2, sy); ctx.fill();
    ctx.beginPath(); ctx.moveTo(sx - 4, sy); ctx.lineTo(sx, sy + 1.2); ctx.lineTo(sx + 4, sy); ctx.lineTo(sx, sy - 1.2); ctx.fill();
  }
  ctx.restore();
  ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 2.5;
  ctx.setLineDash([16, 12]); ctx.lineDashOffset = -time * 12;
  roundRect(x + 3, y + 3, w - 6, h - 6, 21); ctx.stroke();
  ctx.setLineDash([]); ctx.lineDashOffset = 0;
}

function drawBoost(bz) {
  ctx.save(); roundRect(bz[0] + 4, bz[1] + 4, bz[2] - 8, bz[3] - 8, 9); ctx.clip();
  ctx.translate(bz[0] + bz[2] / 2, bz[1] + bz[3] / 2); ctx.rotate(bz[4]);
  const off = (time * 90) % 42, span = Math.max(bz[2], bz[3]);
  for (let x = -span - 42; x < span + 42; x += 42) {
    const px = x + off, glow = .45 + .55 * clamp((px + span / 2) / span, 0, 1);
    ctx.fillStyle = `rgba(255,248,232,${glow.toFixed(2)})`;
    ctx.beginPath(); ctx.moveTo(px, -20); ctx.lineTo(px + 17, 0); ctx.lineTo(px, 20); ctx.lineTo(px + 7, 0); ctx.fill();
  }
  ctx.restore();
}

function drawFlag() {
  const [cx, cy] = hole.cup, top = cy - 70;
  // shadow of the pole on the grass
  ctx.strokeStyle = 'rgba(0,0,0,.18)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + 34, cy + 22); ctx.stroke();
  const g = ctx.createLinearGradient(cx - 2, 0, cx + 2, 0);
  g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#b9b9b9');
  ctx.strokeStyle = g; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx, top); ctx.stroke(); ctx.lineCap = 'butt';
  ctx.fillStyle = '#ffd23d'; circle(cx, top - 1, 3.5); ctx.fill();
  // waving cloth
  const len = 40, ht = 24, seg = 10;
  ctx.beginPath(); ctx.moveTo(cx + 1.5, top + 2);
  for (let i = 1; i <= seg; i++) { const u = i / seg; ctx.lineTo(cx + 1.5 + u * len, top + 2 + Math.sin(time * 5 - u * 4) * 4 * u); }
  for (let i = seg; i >= 0; i--) { const u = i / seg; ctx.lineTo(cx + 1.5 + u * len, top + 2 + ht - u * 4 + Math.sin(time * 5 - u * 4) * 4 * u); }
  ctx.closePath();
  const fg = ctx.createLinearGradient(cx, top, cx + len, top + ht);
  fg.addColorStop(0, '#ff5a4e'); fg.addColorStop(1, '#d92d4a');
  ctx.fillStyle = fg; ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = '700 13px Fredoka, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(holeIdx + 1, cx + 18, top + 13 + Math.sin(time * 5 - 1.8) * 1.8);
}

function drawBumper(bm) {
  bm.flash = Math.max(0, (bm.flash || 0) - 1 / 60);
  const s = bm[2] * (1 + bm.flash * .6), [x, y] = bm;
  ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(x + 4, y + 7, s, s * .9, 0, 0, TAU); ctx.fill();
  let g = ctx.createRadialGradient(x - s * .3, y - s * .35, s * .1, x, y, s);
  if (bm.flash) { g.addColorStop(0, '#fff6c4'); g.addColorStop(1, '#f5a400'); }
  else { g.addColorStop(0, '#ff9cc8'); g.addColorStop(.7, '#ff4f9a'); g.addColorStop(1, '#c41870'); }
  ctx.fillStyle = g; circle(x, y, s); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 3; circle(x, y, s * .72); ctx.stroke();
  g = ctx.createRadialGradient(x - s * .15, y - s * .2, 1, x, y, s * .5);
  g.addColorStop(0, '#ffffff'); g.addColorStop(1, bm.flash ? '#ffe27a' : '#ffc4de');
  ctx.fillStyle = g; circle(x, y, s * .48); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.beginPath(); ctx.ellipse(x - s * .42, y - s * .5, s * .2, s * .11, -.6, 0, TAU); ctx.fill();
}

function drawMill(m) {
  ctx.save(); ctx.translate(m[0], m[1]);
  const arms = millArms(m);
  ctx.fillStyle = 'rgba(0,0,0,.22)';
  for (const [ax, ay] of arms) {
    ctx.save(); ctx.translate(5, 8); ctx.rotate(Math.atan2(ay, ax)); roundRect(8, -8, m[2] - 4, 16, 7); ctx.fill(); ctx.restore();
  }
  arms.forEach(([ax, ay], k) => {
    ctx.save(); ctx.rotate(Math.atan2(ay, ax));
    const g = ctx.createLinearGradient(0, -8, 0, 8);
    if (k % 2) { g.addColorStop(0, '#fffaf0'); g.addColorStop(1, '#d8cfbd'); }
    else { g.addColorStop(0, '#ff6b5e'); g.addColorStop(1, '#c0302a'); }
    ctx.fillStyle = g; roundRect(8, -8, m[2] - 4, 16, 7); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.15)'; ctx.lineWidth = 1.5;
    for (let t = 30; t < m[2] - 8; t += 20) { ctx.beginPath(); ctx.moveTo(t, -6); ctx.lineTo(t, 6); ctx.stroke(); }
    ctx.restore();
  });
  const g = ctx.createRadialGradient(-5, -5, 2, 0, 0, 18);
  g.addColorStop(0, '#c68b54'); g.addColorStop(1, '#5e3818');
  ctx.fillStyle = g; circle(0, 0, 17); ctx.fill();
  ctx.fillStyle = '#ffd23d'; circle(0, 0, 5.5); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.6)'; circle(-1.5, -1.5, 2); ctx.fill();
  ctx.restore();
}

function drawMover(m) {
  if (m[8]) return drawKeeper(m);
  const r = moverRect(m, time);
  drawWall(r);
  // drawer handle
  const hx = r[0] + r[2] / 2, hy = r[1] + r[3] / 2;
  ctx.fillStyle = '#5b3a1c'; roundRect(hx - 5, hy - 16, 10, 32, 5); ctx.fill();
  ctx.fillStyle = '#e8c15a'; roundRect(hx - 3.5, hy - 14, 7, 28, 3.5); ctx.fill();
  emoji('🧦', hx, r[1] + 16, 16);
}

function drawAim() {
  const { ang, power } = aimVec(), club = CLUBS[clubIdx];
  const landing = hole.lob ? lobLanding(ang, power) : null;
  const len = landing ? Math.max(20, landing[2] - item.r - 14) : 40 + power * 210, col = `hsl(${120 - power * 120},90%,55%)`;
  if (landing) {
    ctx.save(); ctx.translate(landing[0], landing[1]);
    ctx.strokeStyle = 'rgba(255,255,255,.95)'; ctx.lineWidth = 2.5; ctx.setLineDash([6, 5]); ctx.lineDashOffset = -time * 20;
    circle(0, 0, item.r + 4); ctx.stroke(); ctx.setLineDash([]);
    ctx.beginPath(); ctx.moveTo(-8, 0); ctx.lineTo(8, 0); ctx.moveTo(0, -8); ctx.lineTo(0, 8); ctx.stroke();
    ctx.restore();
  }
  // power ring around the item
  ctx.lineCap = 'round';
  ctx.strokeStyle = 'rgba(0,0,0,.3)'; ctx.lineWidth = 6; circle(ball.x, ball.y, item.r + 12); ctx.stroke();
  ctx.strokeStyle = col; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.arc(ball.x, ball.y, item.r + 12, -Math.PI / 2, -Math.PI / 2 + power * TAU); ctx.stroke();
  ctx.lineCap = 'butt';

  ctx.save(); ctx.translate(ball.x, ball.y); ctx.rotate(ang);
  const path = u => { // returns [x, y] along the predicted wiggle
    const x = item.r + 14 + u * len;
    if (club.wobble) return [x, Math.sin(x / 10 + time * 12) * 9 * u];
    if (club.chicken) return [x, Math.sin(u * Math.PI) * Math.sin(time * 4) * 38];
    if (club.lob || hole.lob) return [x, -Math.sin(u * Math.PI) * (hole.lob ? 90 : 55) * power];
    return [x, 0];
  };
  const dots = Math.max(4, Math.floor(len / 14));
  for (let i = 0; i <= dots; i++) {
    const u = i / dots, [px, py] = path(u), rad = 5 - u * 2.5;
    ctx.fillStyle = 'rgba(0,0,0,.25)'; circle(px + 1.5, py + 2, rad); ctx.fill();
    ctx.fillStyle = i % 2 ? col : '#ffffff'; circle(px, py, rad); ctx.fill();
  }
  const [ex, ey] = path(1);
  ctx.translate(ex, ey);
  ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.moveTo(19.5, 2); ctx.lineTo(1.5, -9); ctx.lineTo(1.5, 13); ctx.fill();
  ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(18, 0); ctx.lineTo(0, -11); ctx.lineTo(0, 11); ctx.fill();
  ctx.restore();

  // the club, wound up behind the item
  ctx.save(); ctx.translate(ball.x, ball.y); ctx.rotate(ang);
  emoji(club.emoji, -item.r - 22 - power * 30, 0, 40, Math.PI / 2 * (club.chicken ? 0 : 1) - power * .5);
  ctx.restore();

  label(Math.round(power * 100) + '%', ball.x, ball.y - item.r - 30, 15);
}

function label(text, x, y, size = 15) {
  ctx.font = `600 ${size}px Fredoka, sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const w = ctx.measureText(text).width + 18, h = size + 10;
  x = clamp(x, w / 2 + B + 4, W - B - 4 - w / 2);
  ctx.fillStyle = 'rgba(25,35,25,.72)'; roundRect(x - w / 2, y - h / 2, w, h, h / 2); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.fillText(text, x, y + 1);
}

function drawItem() {
  if (ball.gone) return;
  let lift = 0, scale = 1;
  if (ball.air > 0) { const k = 1 - ball.air / ball.airT; lift = Math.sin(k * Math.PI) * 50 * Math.min(1, ball.airT); scale = 1 + lift / 80; }
  if (state === 'sinking') { sinkAnim += 1 / 60; scale = Math.max(0, 1 - sinkAnim * 2.5); ball.x += (hole.cup[0] - ball.x) * .2; ball.y += (hole.cup[1] - ball.y) * .2; }
  if (scale <= 0) return;

  // motion trail
  const tr = ball.trail || [];
  for (let i = 0; i < tr.length; i++) {
    const u = (i + 1) / tr.length;
    ctx.fillStyle = `rgba(255,255,255,${(u * .28).toFixed(3)})`;
    circle(tr[i][0], tr[i][1] - lift * u, item.r * (.35 + u * .5)); ctx.fill();
  }

  // soft shadow that spreads out while airborne
  const sr = item.r * (1 + lift / 120);
  const sx = ball.x + 3 + lift * .35, sy = ball.y + 7 + lift * .45;
  const g = ctx.createRadialGradient(sx, sy, 0, sx, sy, sr);
  g.addColorStop(0, `rgba(0,0,0,${(.38 - lift / 300).toFixed(3)})`); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(sx, sy, sr, sr * .6, 0, 0, TAU); ctx.fill();

  const inWater = item.floats && hole.water.some(r => inRect(ball.x, ball.y, r));
  if (inWater) { // ripples around the swimming duck
    for (let k = 0; k < 2; k++) {
      const t = (time * .8 + k * .5) % 1;
      ctx.strokeStyle = `rgba(255,255,255,${(.6 * (1 - t)).toFixed(2)})`; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.ellipse(ball.x, ball.y + 6, item.r + t * 22, (item.r + t * 22) * .55, 0, 0, TAU); ctx.stroke();
    }
  }
  const bob = inWater ? Math.sin(time * 6) * 2 : 0;
  const q = ball.squash || 0;
  emoji(item.emoji, ball.x, ball.y - lift + bob, item.r * 2.2 * scale,
        item.hops || item.floats ? 0 : ball.rot, 1 + q * .25, 1 - q * .25);
}

function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  if (shake > 0) ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);
  ctx.drawImage(bg, 0, 0, W, H);

  for (const r of hole.water) drawWaterSurface(r);
  for (const bz of hole.boosts) drawBoost(bz);
  for (const m of hole.movers) drawMover(m);
  for (const bm of hole.bumpers) drawBumper(bm);
  for (const m of hole.mills) drawMill(m);
  drawBodies();
  if (hole.hoop) drawHoop();

  // "ready" pulse under a resting item
  if (state === 'play' && !ball.moving && !aim && !ball.gone && !shotActive) {
    const t = (time * 1.2) % 1;
    ctx.strokeStyle = `rgba(255,255,255,${(.7 * (1 - t)).toFixed(2)})`; ctx.lineWidth = 2.5;
    circle(ball.x, ball.y, item.r + 6 + t * 16); ctx.stroke();
  }

  if (aim && state === 'play') drawAim();

  // swing follow-through
  if (swing) {
    swing.t += 1 / 60;
    if (swing.t > .35) swing = null;
    else {
      const k = swing.t / .35;
      ctx.globalAlpha = 1 - k;
      const bx = ball.last[0] - Math.cos(swing.ang) * (30 - k * 40), by = ball.last[1] - Math.sin(swing.ang) * (30 - k * 40);
      emoji(swing.club.emoji, bx, by, 42, swing.ang + Math.PI / 2 - k * 1.5);
      ctx.globalAlpha = 1;
    }
  }

  // the flag goes in front of the item only when the item is above (behind) it
  const behindFlag = hole.cup && ball.y < hole.cup[1];
  if (hole.cup && !behindFlag) drawFlag();
  drawItem();
  if (behindFlag) drawFlag();

  for (const r of rings) {
    const u = 1 - r.t / r.life;
    ctx.strokeStyle = r.color; ctx.globalAlpha = 1 - u; ctx.lineWidth = r.width * (1 - u * .6);
    circle(r.x, r.y, 6 + u * r.max); ctx.stroke();
  }
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life / p.max * 1.5));
    ctx.fillStyle = p.color;
    if (p.rect) {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.scale(1, Math.cos(p.rot * 1.7));
      ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2); ctx.restore();
    } else { circle(p.x, p.y, p.size / 2 * (.5 + .5 * p.life / p.max)); ctx.fill(); }
  }
  ctx.globalAlpha = 1;

  drawFloaters();
  if (state === 'play' && !ball.moving && !aim && strokes === 0)
    label('drag back to aim, let go to swing', ball.x, ball.y + item.r + 34, 14);
}

// ---------- Loop ----------
let lastT = performance.now();
function frame(now) {
  let dt = Math.min(.05, (now - lastT) / 1000); lastT = now;
  time += dt;
  if (state === 'play') {
    const n = 6, h = dt / n;
    for (let i = 0; i < n && state === 'play'; i++) { step(h); stepBodies(h); }
    if (state === 'play' && shotActive) {
      shotT += dt;
      restT = (ball.gone || !ball.moving) && bodiesResting() ? restT + dt : 0;
      if (restT > .45 || shotT > 14) resolveShot();
    }
  }
  for (const p of particles) {
    p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
    const k = Math.pow(p.rect ? .9 : .94, dt * 60); p.vx *= k; p.vy *= k;
    if (p.rect) p.rot += p.vr * dt;
  }
  particles = particles.filter(p => p.life > 0);
  for (const r of rings) r.t -= dt;
  for (const f of floaters) { f.t -= dt; f.y -= 40 * dt; }
  floaters = floaters.filter(f => f.t > 0);
  rings = rings.filter(r => r.t > 0);
  shake = Math.max(0, shake - dt * 30);
  if (ball) {
    ball.squash = Math.max(0, (ball.squash || 0) - dt * 5);
    ball.trail = ball.trail || [];
    if (ball.moving && state === 'play') { ball.trail.push([ball.x, ball.y]); if (ball.trail.length > 12) ball.trail.shift(); }
    else if (ball.trail.length) ball.trail.shift();
  }
  if (hole) draw();
  requestAnimationFrame(frame);
}

// ---------- Start ----------
$('introBtn').onclick = () => { show(null); state = 'play'; };
$('againBtn').onclick = () => startSport(sport.key);
$('menuBtn').onclick = showMenu;
$('menuBtn2').onclick = showMenu;

buildClubs();
buildSportGrid();
prepLevel(0); // golf hole 1 sits behind the title screen
// ?sport=bowling&hole=N jumps straight in (handy for practice)
const params = new URLSearchParams(location.search);
const jumpSport = SPORTS[params.get('sport')] ? params.get('sport') : params.get('hole') ? 'golf' : null;
if (jumpSport) {
  sport = SPORTS[jumpSport]; LEVELS = sport.levels;
  $('hTitle').textContent = `${sport.emoji} ${sport.name}`;
  const jump = clamp(+params.get('hole') || 1, 1, LEVELS.length);
  scores = LEVELS.slice(0, jump - 1).map(h => sport.golf ? h.par : 0);
  loadHole(jump - 1);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
